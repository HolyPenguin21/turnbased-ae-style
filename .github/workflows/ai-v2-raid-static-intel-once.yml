name: AI V2 Raid stationary target scoring once
on:
  push:
    branches:
      - fix/raid-neutral-no-stale-penalty
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded source and regression test edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scripts/Ai/V2/Strategy/Objectives/AggressionObjectiveEvaluator.cs')
          s = p.read_text(encoding='utf-8')
          old = '            float staleRaw = 1f - Mathf.Clamp01(o.Confidence);\n'
          new = '            // Raid targets are stationary neutrals or event guards; older sightings do not move them.\n            // Keep shared StaleIntelPenalty for future attacks on mobile player armies.\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '                staleness: TaskScoreEvaluator.StaleIntelPenalty(staleRaw),\n'
          assert s.count(old) == 1
          s = s.replace(old, '')
          old = 'stale={staleRaw:0.###}'
          assert s.count(old) == 1
          s = s.replace(old, 'stale=0 stationary_raid')
          p.write_text(s, encoding='utf-8')
          p = Path('Assets/Editor/AiAggressionRaidTests.cs')
          s = p.read_text(encoding='utf-8')
          marker = '        // ---- RaidObjectiveEvaluator: event-guard lifecycle -------------------------------------\n'
          assert s.count(marker) == 1
          test = '''        [Test]
                  public void RaidValue_StationaryNeutralAndEventNeverLoseIntelValue()
                  {
                      WorldSnapshot neutral = SnapshotWithNeutralSighting(armyId: 77,
                          hex: new HexCoord(3, 0),
                          defenders: new List<WorthIt.DefenderProfile> { Weak() }, withOwnArmy: true);
                      neutral.TurnNumber = 8; // the sighting was recorded on turn zero
                      CombatOpportunityReport neutralReport = CombatOpportunityAnalyzer.Analyze(neutral);
                      Assert.That(neutralReport.NeutralOpportunities.Single().Confidence,
                          Is.EqualTo(AiConfigV2.threatConfidenceLastKnown));
                      AggressionObjective neutralRaid = AggressionObjectiveEvaluator.Enumerate(
                          neutral, neutralReport).Single();
                      Assert.That(neutralRaid.TaskScore.Staleness, Is.Zero);
                      Assert.That(neutralRaid.BaseValue, Is.EqualTo(AiConfigV2.RaidReward));
          
                      WorldSnapshot eventSnap = SnapshotWithEventGuard(
                          new HexCoord(4, 0), Weak(), withOwnArmy: true);
                      eventSnap.TurnNumber = 8;
                      CombatOpportunityReport eventReport = CombatOpportunityAnalyzer.Analyze(eventSnap);
                      AggressionObjective eventRaid = AggressionObjectiveEvaluator.Enumerate(
                          eventSnap, eventReport).Single();
                      Assert.That(eventRaid.Target.Kind, Is.EqualTo(RaidTargetKind.EventGuard));
                      Assert.That(eventRaid.TaskScore.Staleness, Is.Zero);
                      Assert.That(eventRaid.BaseValue, Is.EqualTo(AiConfigV2.RaidReward));
                      Assert.That(TaskScoreEvaluator.StaleIntelPenalty(0.5f), Is.LessThan(0f));
                  }
          
          '''
          # Dedent only the fixed YAML/script indentation in the triple-quoted test body.
          import textwrap
          test = textwrap.dedent(test)
          assert test.startswith('[Test]')
          test = textwrap.indent(test, '        ')
          s = s.replace(marker, test + marker)
          p.write_text(s, encoding='utf-8')
          print('PASS: Raid-only score update, existing shared penalty preserved, regression inserted')
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/Ai/V2/Strategy/Objectives/AggressionObjectiveEvaluator.cs Assets/Editor/AiAggressionRaidTests.cs
          git commit -m 'fix(ai-v2): remove staleness penalty for stationary Raid targets'
          git push origin HEAD:fix/raid-neutral-no-stale-penalty
