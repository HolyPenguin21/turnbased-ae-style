name: One-time TaskScore comparative calibration
on:
  push:
    branches: [refactor/unified-task-score]
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-task-score
          fetch-depth: 2
      - name: Verify reviewed base
        run: |
          test "$(git rev-parse HEAD^)" = "e0994d4e2323da2d9aa7100331074efc80104471"
      - name: Apply exact-scoped corrections
        env:
          PAYLOAD: 
        run: |
          python3 -c 'import os,base64,zlib;exec(zlib.decompress(base64.b64decode(os.environ["PAYLOAD"])).decode())'
      - name: Check scope and commit corrections
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'Assets/Scripts/Ai/V2/Foundation/AiConfigV2.TaskScore.cs','Assets/Scripts/Ai/V2/Recon/ScoutCostModel.cs','Assets/Scripts/Ai/V2/Strategy/Objectives/ReconObjectiveEvaluator.cs','Assets/Editor/AiUnifiedTaskScoreTests.cs'}
          assert changed==expected,(changed,expected)
          print('Exact four-file calibration scope validated')
          PY
          rm .github/workflows/taskscore-calibration-once.yml
          git add Assets/Scripts/Ai/V2/Foundation/AiConfigV2.TaskScore.cs Assets/Scripts/Ai/V2/Recon/ScoutCostModel.cs Assets/Scripts/Ai/V2/Strategy/Objectives/ReconObjectiveEvaluator.cs Assets/Editor/AiUnifiedTaskScoreTests.cs .github/workflows/taskscore-calibration-once.yml
          git diff --cached --check
          git config user.name 'TaskScore Calibration'
          git config user.email 'taskscore-calibration@users.noreply.github.com'
          git commit -m 'Calibrate physical AP and account for Recon mission costs'
          git push origin HEAD:refactor/unified-task-score