name: One-shot AI V2 P0 scoped implementation
on:
  push:
    branches:
      - ai-v2/production-development-calibration
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message == 'chore(ai-v2): recover P0 transport and apply patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recover checksum-verified transport and apply scoped P0
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const zlib = require('zlib');
          const sha = s => crypto.createHash('sha256').update(s).digest('hex');
          const expectedSegments = ['0497d614b3c8', '62ee58759be2', '0d8548a656b0', '2b6fcf08bd73', '1fa236de8da3', 'd6bc862ba20e'];
          const segments = Array.from({length: 6}, (_, i) => fs.readFileSync(`.github/p0-patch-${i}.txt`, 'utf8').trim());
          for (let i = 0; i < segments.length; i++) {
            if (sha(segments[i]).startsWith(expectedSegments[i])) continue;
            if (i !== 4 || segments[i].length !== 2999) throw Error(`unexpected segment ${i} length/hash`);
            // The transport diagnostics proved precisely one dropped base64 character in segment 4.
            // Recover only the unique insertion whose checksum matches the locally reviewed segment.
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
            let matches = [];
            for (let position = 0; position <= segments[i].length; position++) {
              for (const ch of alphabet) {
                const candidate = segments[i].slice(0, position) + ch + segments[i].slice(position);
                if (sha(candidate).startsWith(expectedSegments[i])) matches.push(candidate);
              }
            }
            if (matches.length !== 1) throw Error(`segment recovery not unique: ${matches.length}`);
            segments[i] = matches[0];
            console.log(`Restored segment ${i} with unique checksum match`);
          }
          for (let i=0; i<segments.length; i++)
            if (!sha(segments[i]).startsWith(expectedSegments[i])) throw Error(`segment ${i} mismatch`);
          const patch = zlib.brotliDecompressSync(Buffer.from(segments.join(''), 'base64'));
          const actual = sha(patch);
          const expected = 'c414de6295bf26a2a9efe76688060be79420040322e975fc5110f03f6a73d7d1';
          if (actual !== expected) throw Error(`source patch checksum mismatch: ${actual}`);
          fs.writeFileSync('/tmp/ai-v2-p0.patch', patch);
          console.log(`Verified P0 patch SHA256=${actual}, size=${patch.length}`);
          JS
          git apply --check /tmp/ai-v2-p0.patch
          git apply /tmp/ai-v2-p0.patch
          git diff --check
          git diff --stat
          git config user.name 'ai-v2-scoped-patch'
          git config user.email 'ai-v2-scoped-patch@users.noreply.github.com'
          git add Assets
          git diff --cached --check
          git commit -m 'feat(ai-v2): wire remote development hero through existing mission lifecycle [skip ci]'
          git push origin HEAD:ai-v2/production-development-calibration
