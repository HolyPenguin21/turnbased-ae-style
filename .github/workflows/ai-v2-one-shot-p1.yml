name: One-shot AI V2 P0 scoped implementation
on:
  push:
    branches:
      - ai-v2/production-development-calibration
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message == 'chore(ai-v2): apply checksum-repaired P0 patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exact source patch and apply
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs'), crypto = require('crypto'), zlib = require('zlib');
          const sha = s => crypto.createHash('sha256').update(s).digest('hex');
          const expectedSegments = ['0497d614b3c8', '62ee58759be2', '0d8548a656b0', '2b6fcf08bd73', '1fa236de8da3', 'd6bc862ba20e'];
          const segments = Array.from({length:6}, (_,i) => fs.readFileSync(`.github/p0-patch-${i}.txt`, 'utf8').trim());
          if (segments[4].length !== 2999 || !sha(segments[4]).startsWith('1dc5bed3e24f'))
            throw Error('unexpected transport corruption; refuse patch');
          // Compare with checked original: a single 2-character sequence was transcribed as 1 character.
          const wrong = 'WPrQO5r7J44', correct = 'WPrQO5r7jL44';
          if (segments[4].split(wrong).length !== 2) throw Error('transport replacement anchor drift');
          segments[4] = segments[4].replace(wrong, correct);
          for (let i=0;i<segments.length;i++) {
            console.log(`segment ${i}: len=${segments[i].length} sha=${sha(segments[i]).slice(0,12)}`);
            if (!sha(segments[i]).startsWith(expectedSegments[i])) throw Error(`segment ${i} checksum mismatch`);
          }
          const patch = zlib.brotliDecompressSync(Buffer.from(segments.join(''), 'base64'));
          const actual = sha(patch), expected = 'c414de6295bf26a2a9efe76688060be79420040322e975fc5110f03f6a73d7d1';
          if (actual !== expected) throw Error(`source patch checksum mismatch: ${actual}`);
          fs.writeFileSync('/tmp/ai-v2-p0.patch',patch);
          console.log(`Verified exact patch sha256=${actual}, ${patch.length} bytes`);
          JS
          git apply --check /tmp/ai-v2-p0.patch
          git apply /tmp/ai-v2-p0.patch
          git diff --check
          git diff --stat
          git config user.name 'ai-v2-scoped-patch'
          git config user.email 'ai-v2-scoped-patch@users.noreply.github.com'
          git add Assets
          git diff --cached --check
          git commit -m 'feat(ai-v2): wire remote development hero through existing mission lifecycle [skip ci]'
          git push origin HEAD:ai-v2/production-development-calibration
