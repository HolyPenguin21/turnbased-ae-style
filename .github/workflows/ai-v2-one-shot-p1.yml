name: One-shot AI V2 source export
on:
  push:
    branches:
      - ai-v2/production-development-calibration
permissions:
  contents: read
jobs:
  export:
    if: "github.event.head_commit.message == 'chore(ai-v2): export scoped source for implementation'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package AI V2 and gameplay code for grounded patching
        run: zip -rq scoped-source.zip Assets/Scripts/Ai Assets/Scripts/Cards Assets/Scripts/Map Assets/Scripts/Units Assets/Editor Docs/ai-v2-file-split-refactor-tasks.md
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-source
          path: scoped-source.zip
          retention-days: 1
