name: One-shot AI V2 P0 scoped implementation
on:
  push:
    branches:
      - ai-v2/production-development-calibration
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message == 'chore(ai-v2): execute scoped P0 patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and apply reviewed P0 source diff
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const zlib = require('zlib');
          const encoded = Array.from({length: 6}, (_, i) =>
            fs.readFileSync(`.github/p0-patch-${i}.txt`, 'utf8').trim()).join('');
          const patch = zlib.brotliDecompressSync(Buffer.from(encoded, 'base64'));
          const actual = crypto.createHash('sha256').update(patch).digest('hex');
          const expected = 'c414de6295bf26a2a9efe76688060be79420040322e975fc5110f03f6a73d7d1';
          if (actual !== expected) throw Error(`source patch checksum mismatch: ${actual}`);
          fs.writeFileSync('/tmp/ai-v2-p0.patch', patch);
          console.log(`Verified P0 diff SHA256 ${actual}, ${patch.length} bytes`);
          JS
          git apply --check /tmp/ai-v2-p0.patch
          git apply /tmp/ai-v2-p0.patch
          git diff --check
          git diff --stat
          git config user.name 'ai-v2-scoped-patch'
          git config user.email 'ai-v2-scoped-patch@users.noreply.github.com'
          git add Assets
          git diff --cached --check
          git commit -m 'feat(ai-v2): wire remote development hero through existing mission lifecycle [skip ci]'
          git push origin HEAD:ai-v2/production-development-calibration
