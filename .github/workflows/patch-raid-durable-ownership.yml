name: Apply raid durable actor ownership fix

on:
  push:
    branches:
      - fix/raid-durable-actor-ownership
    paths:
      - .github/workflows/patch-raid-durable-ownership.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-durable-actor-ownership
          fetch-depth: 0
      - name: Apply guarded patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          aggression = 'Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs'
          provisioning = 'Assets/Scripts/Ai/V2/Provisioning/ProvisioningManager.cs'

          replace_once(
              aggression,
              '''            var fresh = new List<RaidCandidate>();\n            foreach (AggressionObjective o in objectives)\n                fresh.Add(ToCandidate(snap, o, breakdown));\n''',
              '''            // Fresh Raid scoring must use the same actor-ownership view Provisioning enforces.\n            // Otherwise a busy Economy/Recon/Raid actor can make a fresh Raid look executable and cheap,\n            // only to be rejected later by the batch assignment. Incumbents are allowed to keep their\n            // own pinned mover below; every other durable actor remains excluded from host/donor selection.\n            ActorCommitments actorCommitments = ActorCommitments.FromIntents(activeIntents, snap, null);\n            HashSet<int> durableClaimedActors = actorCommitments?.ClaimedArmyIdSet ?? new HashSet<int>();\n\n            var fresh = new List<RaidCandidate>();\n            foreach (AggressionObjective o in objectives)\n                fresh.Add(ToCandidate(snap, o, breakdown, excludedArmyIds: durableClaimedActors));\n''')

          replace_once(
              aggression,
              '''        private static RaidCandidate ToCandidate(WorldSnapshot snap, AggressionObjective o,\n            DesireBreakdown bd, int? pinnedPrimaryArmyId = null, bool operationStarted = false)\n        {\n            RaidMissionTarget target = o.ToTarget();\n            IReadOnlyList<WorthIt.DefenderProfile> defenders = AiV2Util.KnownDefenders(snap, o.Target);\n            GroundCombatAssemblyPlan live = pinnedPrimaryArmyId.HasValue\n                ? GroundCombatAssemblyPlanner.Plan(snap, new GroundCombatAssemblyRequest\n                {\n                    Defenders = defenders,\n                    PreferredPrimaryArmyId = pinnedPrimaryArmyId,\n                    PinToPreferred = true,\n                    WinChanceGate = operationStarted\n                        ? RaidAdmissionPolicy.ContinuationWinChanceFloor\n                        : RaidAdmissionPolicy.FreshStartWinChanceGate,\n                })\n                : GroundCombatAssemblyPlanner.Plan(snap, target, defenders, null);\n''',
              '''        private static RaidCandidate ToCandidate(WorldSnapshot snap, AggressionObjective o,\n            DesireBreakdown bd, int? pinnedPrimaryArmyId = null, bool operationStarted = false,\n            ISet<int> excludedArmyIds = null)\n        {\n            RaidMissionTarget target = o.ToTarget();\n            IReadOnlyList<WorthIt.DefenderProfile> defenders = AiV2Util.KnownDefenders(snap, o.Target);\n\n            // A durable incumbent owns its own mover, so remove only that actor from the exclusion\n            // set while keeping every other committed host/donor unavailable to this Raid.\n            ISet<int> effectiveExclusions = excludedArmyIds;\n            if (pinnedPrimaryArmyId.HasValue && excludedArmyIds != null\n                && excludedArmyIds.Contains(pinnedPrimaryArmyId.Value))\n            {\n                var copy = new HashSet<int>(excludedArmyIds);\n                copy.Remove(pinnedPrimaryArmyId.Value);\n                effectiveExclusions = copy;\n            }\n\n            GroundCombatAssemblyPlan live = pinnedPrimaryArmyId.HasValue\n                ? GroundCombatAssemblyPlanner.Plan(snap, new GroundCombatAssemblyRequest\n                {\n                    Defenders = defenders,\n                    PreferredPrimaryArmyId = pinnedPrimaryArmyId,\n                    PinToPreferred = true,\n                    ExcludedArmyIds = effectiveExclusions,\n                    WinChanceGate = operationStarted\n                        ? RaidAdmissionPolicy.ContinuationWinChanceFloor\n                        : RaidAdmissionPolicy.FreshStartWinChanceGate,\n                })\n                : GroundCombatAssemblyPlanner.Plan(snap, target, defenders, effectiveExclusions);\n''')

          replace_once(
              provisioning,
              '''        public readonly HashSet<int> ClaimedArmyIds = new HashSet<int>();\n''',
              '''        public readonly HashSet<int> ClaimedArmyIds = new HashSet<int>();\n        // Durable ownership is distinct from same-pass claims. Provisioning must preserve both:\n        // the batch solvers filter with this set, and Raid live revalidation uses it for hosts and\n        // assembly donors so a retry cannot steal an Economy/Recon/Raid incumbent.\n        public readonly HashSet<int> DurableClaimedArmyIds = new HashSet<int>();\n''')

          replace_once(
              provisioning,
              '''        internal void SetRaidAssignment(Dictionary<StableMissionKey, int> a)\n        {\n            _raidAssignment.Clear();\n            foreach (KeyValuePair<StableMissionKey, int> kv in a)\n                _raidAssignment[kv.Key] = kv.Value;\n        }\n''',
              '''        internal void SetRaidAssignment(Dictionary<StableMissionKey, int> a)\n        {\n            _raidAssignment.Clear();\n            foreach (KeyValuePair<StableMissionKey, int> kv in a)\n                _raidAssignment[kv.Key] = kv.Value;\n        }\n\n        internal void SetDurableClaims(IEnumerable<int> ids)\n        {\n            DurableClaimedArmyIds.Clear();\n            if (ids == null) return;\n            foreach (int id in ids) DurableClaimedArmyIds.Add(id);\n        }\n''')

          replace_once(
              provisioning,
              '''        {\n            PrepareScoutAssignments(player, root, ctx, session, allocation, durableCommitments);\n            PrepareGroundCombatAssignments(session, allocation, durableCommitments);\n        }\n''',
              '''        {\n            session.SetDurableClaims(durableCommitments?.ClaimedArmyIds);\n            PrepareScoutAssignments(player, root, ctx, session, allocation, durableCommitments);\n            PrepareGroundCombatAssignments(session, allocation, durableCommitments);\n        }\n''')

          replace_once(
              provisioning,
              '''            GroundCombatAssemblyPlan plan = null;\n            if (session.TryGetAssignedRaidActor(key, out int assignedActor)\n                && !session.ClaimedArmyIds.Contains(assignedActor))\n            {\n                GroundCombatAssemblyPlan assigned = GroundCombatAssemblyPlanner.PlanForArmy(snap, target, defenders, assignedActor);\n                if (assigned.Feasible) plan = assigned;\n            }\n            if (plan == null)\n                plan = GroundCombatAssemblyPlanner.Plan(snap, target, defenders, session.ClaimedArmyIds);\n\n            if (!plan.Feasible)\n            {\n                GroundCombatAssemblyPlan unrestricted = GroundCombatAssemblyPlanner.Plan(snap, target, defenders, null);\n                if (unrestricted.Feasible)\n                    return ProvisioningResult.Fail(ProvisionFailure.MoverContended(\n                        $\"raid target {raidTarget.DiagnosticLabel} has an executable force but its host/donor is already claimed; {plan.Reason}\"));\n                return ProvisioningResult.Fail(ProvisionFailure.AssemblyInfeasible(plan.Reason));\n            }\n''',
              '''            // Assault actor ownership is decided once by PrepareGroundCombatAssignments.\n            // Never re-search with a weaker exclusion set here: that previously allowed a Raid to\n            // steal a durable Economy/Recon/Raid actor after the batch solver had correctly rejected it.\n            if (!session.TryGetAssignedRaidActor(key, out int assignedActor))\n                return ProvisioningResult.Fail(ProvisionFailure.MoverContended(\n                    $\"raid target {raidTarget.DiagnosticLabel} has no free ground-combat actor assigned this cycle\"));\n            if (session.ClaimedArmyIds.Contains(assignedActor))\n                return ProvisioningResult.Fail(ProvisionFailure.MoverContended(\n                    $\"assigned raid actor #{assignedActor} was claimed by an earlier mission this cycle\"));\n\n            var raidExclusions = new HashSet<int>(session.ClaimedArmyIds);\n            raidExclusions.UnionWith(session.DurableClaimedArmyIds);\n            // The batch solver already authorised this exact actor. For a continuing Raid it is\n            // expected to appear in DurableClaimedArmyIds as its own incumbent; other durable\n            // actors (including assembly donors) remain excluded.\n            raidExclusions.Remove(assignedActor);\n\n            float assignedGate = m.FromDurableIntent\n                && m.DurableFundingTier == CommitmentTier.Hard\n                && m.PreferredMoverArmyId.HasValue\n                && m.PreferredMoverArmyId.Value == assignedActor\n                    ? RaidAdmissionPolicy.ContinuationWinChanceFloor\n                    : RaidAdmissionPolicy.FreshStartWinChanceGate;\n            GroundCombatAssemblyPlan plan = GroundCombatAssemblyPlanner.Plan(snap,\n                new GroundCombatAssemblyRequest\n                {\n                    Defenders = defenders,\n                    PreferredPrimaryArmyId = assignedActor,\n                    PinToPreferred = true,\n                    ExcludedArmyIds = raidExclusions,\n                    WinChanceGate = assignedGate,\n                });\n            if (!plan.Feasible)\n                return ProvisioningResult.Fail(ProvisionFailure.MoverContended(\n                    $\"assigned raid actor #{assignedActor} is no longer executable without stealing a claimed host/donor: {plan.Reason}\"));\n''')

          # Guard the ownership rule against future accidental reintroduction of an unrestricted fallback.
          text = Path(provisioning).read_text(encoding='utf-8')
          assault_start = text.index('// Assault — defender resolution')
          assault_end = text.index('// =====================================================================================', assault_start)
          assault = text[assault_start:assault_end]
          if 'GroundCombatAssemblyPlanner.Plan(snap, target, defenders, null)' in assault:
              raise SystemExit('unrestricted Raid assault fallback still exists')
          if 'DurableClaimedArmyIds' not in assault:
              raise SystemExit('Raid assault no longer protects durable claims')

          # Cheap syntax sanity for the exact edits: braces must remain balanced in both changed files.
          for path in (aggression, provisioning):
              t = Path(path).read_text(encoding='utf-8')
              if t.count('{') != t.count('}'):
                  raise SystemExit(f'{path}: brace imbalance')

      - name: Show diff
        run: |
          git diff --check
          git diff --stat
          git diff -- Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs Assets/Scripts/Ai/V2/Provisioning/ProvisioningManager.cs
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs Assets/Scripts/Ai/V2/Provisioning/ProvisioningManager.cs
          git commit -m "fix(ai): preserve durable actor ownership for raids"
          git rm .github/workflows/patch-raid-durable-ownership.yml
          git commit -m "chore: remove temporary raid patch workflow"
          git push origin HEAD:fix/raid-durable-actor-ownership
