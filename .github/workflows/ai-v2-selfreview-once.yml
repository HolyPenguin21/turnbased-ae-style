name: Apply AI V2 completion self-review once
on:
  push:
    branches: [fix/ai-v2-post89-correctness]
    paths: [.github/workflows/ai-v2-selfreview-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-anchor fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ai-v2-selfreview-apply-once.py
          python3 .github/ai-v2-selfreview-apply-once.py
          git rm -- .github/ai-v2-selfreview-apply-once.py .github/workflows/ai-v2-selfreview-once.yml
          git add -- Assets/Scripts/Ai/V2/Strategy/Demand/InfrastructureFulfillment.cs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai-v2): preserve valid completion against unrelated AP owner holds'
          git push origin HEAD:fix/ai-v2-post89-correctness
