name: Apply post-residual ownership refresh
on:
  push:
    branches:
      - fix/radar-phase-a-residual-admission
    paths:
      - .github/workflows/ai-v2-one-shot-radar-housekeeping.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs
            .github/workflows/ai-v2-one-shot-radar-housekeeping.yml
      - name: Refresh canonical actor commitments before housekeeping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs')
          s=p.read_text()
          old='                // Final reconciliation remains the only owner of end-of-turn aging/reaping. Intents'
          new='                // Cold Phase A and the following typed admissions may have created or\n                // re-bound actors AFTER management captured postCommitments. Housekeeping\n                // must see the latest canonical ownership, never the pre-cold snapshot.\n                postCommitments = ActorCommitments.FromIntents(\n                    MissionIntentRegistry.GetOrCreate(player).All, snapshot, reconObjectives);\n\n'+old
          assert s.count(old)==1, 'one final typed reconciliation owner expected'
          p.write_text(s.replace(old,new,1))
          print('PASS post-management actor ownership refresh anchored to final typed reconciliation')
          PY
          git diff --check
          git diff --stat
          git add -- Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs
          git config user.name 'AI V2 patch delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai-v2): refresh actor commitments after cold residual before housekeeping'
          git push origin HEAD:fix/radar-phase-a-residual-admission