name: Patch Raid return fallback validator

on:
  push:
    branches:
      - fix/raid-return-fallback-validator

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-return-fallback-validator
      - name: Apply exact validator patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("Assets/Scripts/Ai/V2/Continuity/MissionContinuityLayer.cs")
          text = path.read_text(encoding="utf-8")
          already = "&& mover.ReachableOwnBaseHexes.Count > 0" in text
          pattern = re.compile(r"(?m)^(\s*)&& !mover\.ReachableOwnBaseHexes\.Contains\(hex\.Value\)\)$")
          matches = list(pattern.finditer(text))
          if already:
              if len(matches) != 1:
                  raise SystemExit(f"Patch marker exists but validator match count is {len(matches)}")
              print("Patch already applied; nothing to do.")
          else:
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one validator match, found {len(matches)}")
              match = matches[0]
              indent = match.group(1)
              replacement = (
                  indent + "&& mover.ReachableOwnBaseHexes.Count > 0\n"
                  + indent + "&& !mover.ReachableOwnBaseHexes.Contains(hex.Value))"
              )
              text = text[:match.start()] + replacement + text[match.end():]
              path.write_text(text, encoding="utf-8")
          PY
      - name: Verify diff is scoped
        shell: bash
        run: |
          git diff --check
          git diff -- Assets/Scripts/Ai/V2/Continuity/MissionContinuityLayer.cs
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Ai/V2/Continuity/MissionContinuityLayer.cs
          git commit -m "Keep Raid return fallback stable"
          git push origin HEAD:fix/raid-return-fallback-validator
