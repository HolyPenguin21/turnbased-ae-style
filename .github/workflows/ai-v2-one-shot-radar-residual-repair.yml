name: Apply code only Radar patch
on:
  push:
    branches:
      - fix/radar-phase-a-residual-admission
    paths:
      - .github/workflows/ai-v2-one-shot-radar-residual-repair.yml
permissions:
  contents: write
jobs:
  patch-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Assets/Scripts/Ai/V2/Strategy/StrategicPhaseA.cs
            Assets/Scripts/Ai/V2/Strategy/StrategicManager.cs
            Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs
            Assets/Editor/AiRadarProportionalRegressionTests.cs
            .github/workflows/ai-v2-one-shot-radar-residual.yml
            .github/workflows/ai-v2-one-shot-radar-residual-repair.yml
      - name: Execute anchored edits and commit only game code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('.github/workflows/ai-v2-one-shot-radar-residual.yml')
          lines=p.read_text().splitlines()
          in_triple=False
          fixed=[]
          for line in lines:
              if in_triple:
                  line='          '+line
              if line.count("'''") % 2:
                  in_triple=not in_triple
              fixed.append(line.rstrip())
          assert not in_triple, 'unclosed triple quotes in source patch'
          run_index=fixed.index('        run: |')
          body='\n'.join(line[10:] if line.startswith('          ') else line
                         for line in fixed[run_index+1:])+'\n'
          old='git rm -- .github/workflows/ai-v2-one-shot-radar-residual.yml'
          assert body.count(old)==1, 'workflow cleanup anchor changed'
          body=body.replace(old, 'git status --short', 1)
          result=subprocess.run(['bash','-e','-o','pipefail','-c',body], check=False)
          if result.returncode:
              raise SystemExit(f'game code patch failed, exit {result.returncode}')
          print('PASS: code-only patch pushed; workflow files unchanged')
          PY