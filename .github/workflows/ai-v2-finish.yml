name: Apply AI V2 final fixes

on:
  push:
    branches:
      - fix/ai-v2-recon-strategy-loop
    paths:
      - .github/workflows/ai-v2-finish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-v2-recon-strategy-loop
          fetch-depth: 0
      - name: Apply deterministic source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # EconomyStanding exposes the actual per-resource income target used by the model.
          replace_once(
              "Assets/Scripts/Ai/V2/WorldSnapshot.cs",
              """        public ResourceBundle DeckResourceNeed;\n\n        public float RelativePressure;""",
              """        public ResourceBundle DeckResourceNeed;\n\n        // Sustainable per-turn income target by resource. Unlike DeckResourceNeed this is NOT\n        // \"pay the remaining deck within N turns\": it is the larger of the field-median income\n        // and this deck's average per-card resource cadence. Stockpile runway affects security,\n        // not the target itself.\n        public ResourceBundle IncomeTarget;\n\n        public float RelativePressure;""")

          old_eco = """            // ResourceBundle is a struct. These helpers MUST receive it by ref; passing by value\n            // silently accumulated into a copy and left DeckResourceNeed at 0/0/0/0 every turn.\n            var need = new ResourceBundle();\n            AccumulateCardCosts(snap.Self.Hand, ref need);\n            AccumulateCardCosts(snap.Self.Deck, ref need);\n            eco.DeckResourceNeed = need;\n\n            float target = need.Sum / Mathf.Max(0.0001f, AiConfigV2.economyDeckNeedHorizonTurns);\n            float actual = snap.Self.PerTurnIncome.Sum;\n            eco.AbsFloor = target <= 0.0001f ? 1f : Mathf.SmoothStep(0f, 1f, Mathf.Clamp01(actual / target));\n"""
          new_eco = """            // ResourceBundle is a struct. These helpers MUST receive it by ref; passing by value\n            // silently accumulated into a copy and left DeckResourceNeed at 0/0/0/0 every turn.\n            var need = new ResourceBundle();\n            AccumulateCardCosts(snap.Self.Hand, ref need);\n            AccumulateCardCosts(snap.Self.Deck, ref need);\n            eco.DeckResourceNeed = need;\n\n            // Do NOT treat the whole remaining deck as something income must repay inside a fixed\n            // three-turn window. That made a normal opening deck (e.g. 67 total resource points)\n            // report a nonsensical ~22 income/turn target. The sustainable target is per resource:\n            //   1) what one typical remaining playable card asks for, and\n            //   2) what the opponent field currently earns.\n            // We need to keep pace with the larger of those two signals. Existing stockpile is a\n            // runway buffer for SECURITY, but never inflates/deflates the target itself.\n            int remainingPlayableCards = snap.Self.Hand.Count(card =>\n                    card?.Definition != null\n                    && (card.Definition.cardType == CardType.Unit || card.Definition.cardType == CardType.Hero\n                        || card.Definition.cardType == CardType.Facility || card.Definition.cardType == CardType.Base))\n                + snap.Self.Deck.Count(d => d != null\n                    && (d.cardType == CardType.Unit || d.cardType == CardType.Hero\n                        || d.cardType == CardType.Facility || d.cardType == CardType.Base));\n            float cadenceDenom = Mathf.Max(1f, remainingPlayableCards);\n            float runwayTurns = Mathf.Max(1f, AiConfigV2.economyDeckNeedHorizonTurns);\n            var incomeTarget = new ResourceBundle();\n            float coverageAccum = 0f;\n            float worstCoverage = 1f;\n            foreach (EconomyResourceStanding rs in perType)\n            {\n                float cardCadence = need.Get(rs.Type) / cadenceDenom;\n                float target = Mathf.Max(cardCadence, rs.FieldMedianIncome);\n                incomeTarget.Add(rs.Type, target);\n\n                float smoothCoverage = 1f;\n                if (target > 0.0001f)\n                {\n                    float stockRunwayPerTurn = snap.Self.Stockpile.Get(rs.Type) / runwayTurns;\n                    float effectiveSupply = rs.OwnIncome + Mathf.Min(target, stockRunwayPerTurn);\n                    float coverage = Mathf.Clamp01(effectiveSupply / target);\n                    smoothCoverage = Mathf.SmoothStep(0f, 1f, coverage);\n                }\n                coverageAccum += smoothCoverage;\n                worstCoverage = Mathf.Min(worstCoverage, smoothCoverage);\n            }\n            eco.IncomeTarget = incomeTarget;\n            float meanCoverage = coverageAccum / Mathf.Max(1, ResourceBundle.All.Length);\n            eco.AbsFloor = Mathf.Clamp01(0.65f * meanCoverage + 0.35f * worstCoverage);\n"""
          replace_once("Assets/Scripts/Ai/V2/WorldAnalysis.cs", old_eco, new_eco)

          replace_once(
              "Assets/Scripts/Ai/V2/WorldAnalysis.cs",
              """                + $"| deckNeed H/E/M/T={F(eco.DeckResourceNeed.Human)}/{F(eco.DeckResourceNeed.Energy)}/"\n                + $"{F(eco.DeckResourceNeed.Materials)}/{F(eco.DeckResourceNeed.Tech)} "\n                + $"targetIncome/turn={F(eco.DeckResourceNeed.Sum / System.Math.Max(0.0001f, AiConfigV2.economyDeckNeedHorizonTurns))} "\n                + $"actualIncome={F(self.PerTurnIncome.Sum)}");""",
              """                + $"| deckNeed H/E/M/T={F(eco.DeckResourceNeed.Human)}/{F(eco.DeckResourceNeed.Energy)}/"\n                + $"{F(eco.DeckResourceNeed.Materials)}/{F(eco.DeckResourceNeed.Tech)} "\n                + $"| targetIncome H/E/M/T={F(eco.IncomeTarget.Human)}/{F(eco.IncomeTarget.Energy)}/"\n                + $"{F(eco.IncomeTarget.Materials)}/{F(eco.IncomeTarget.Tech)} total={F(eco.IncomeTarget.Sum)} "\n                + $"actualIncome={F(self.PerTurnIncome.Sum)}");""")

          # ECO demand is about a real per-resource shortfall, not merely whether income is non-zero.
          replace_once(
              "Assets/Scripts/Ai/V2/DemandLayer.cs",
              """            if (emitted == 0)\n                AiDebugLog.Write(\"[AI][V2][Demand][Economy] decision=SATISFIED reason=every_known_site_built_or_type_has_income\");""",
              """            if (emitted == 0)\n            {\n                bool hasIncomeGap = ResourceBundle.All.Any(t => !HasIncomeFor(s, t));\n                AiDebugLog.Write(hasIncomeGap\n                    ? \"[AI][V2][Demand][Economy] decision=NONE reason=income_gap_but_no_actionable_known_site\"\n                    : \"[AI][V2][Demand][Economy] decision=SATISFIED reason=known_income_targets_covered_or_sites_built\");\n            }""")
          replace_once(
              "Assets/Scripts/Ai/V2/DemandLayer.cs",
              """        private static bool HasIncomeFor(WorldSnapshot s, ResourceType type)\n        {\n            if (s?.Self?.PerTurnIncome != null && s.Self.PerTurnIncome.Get(type) > 0f)\n                return true;\n            return false;\n        }""",
              """        private static bool HasIncomeFor(WorldSnapshot s, ResourceType type)\n        {\n            if (s?.Self == null || s.Economy == null)\n                return false;\n            float target = Mathf.Max(0f, s.Economy.IncomeTarget.Get(type));\n            if (target <= AiConfigV2.allocatorSliceEpsilon)\n                return true;\n            return s.Self.PerTurnIncome.Get(type) + AiConfigV2.allocatorSliceEpsilon >= target;\n        }""")

          # Phase-B recurring AP income is long-term economy of actions, not generic body value.
          replace_once(
              "Assets/Scripts/Ai/V2/AiConfigV2.cs",
              """        public const float surplusHeroVersatility = 0.35f;\n        public const float surplusUnitVersatility = 0.25f;""",
              """        public const float surplusHeroVersatility = 0.35f;\n        public const float surplusUnitVersatility = 0.25f;\n        // A deployed ApBonus source pays back every following turn. Keep this large enough to beat\n        // a generic low-value garrison body in Phase B, without bypassing required Phase-A demands.\n        public const float surplusRecurringApIncomeBonus = 0.75f;""")
          replace_once(
              "Assets/Scripts/Ai/V2/MaterializationCandidateBuilder.cs",
              """            float handPressure = hand.HasFreeSlot ? 0f : AiConfigV2.surplusHandPressureBonus;\n            float oversupply = recce && inv != null""",
              """            float handPressure = hand.HasFreeSlot ? 0f : AiConfigV2.surplusHandPressureBonus;\n            float recurringApIncome = projected != null && projected.Contains(UnitAbilities.ApBonus)\n                ? AiConfigV2.surplusRecurringApIncomeBonus : 0f;\n            float oversupply = recce && inv != null""")
          replace_once(
              "Assets/Scripts/Ai/V2/MaterializationCandidateBuilder.cs",
              """            return scarcity + versatility + traits + handPressure\n                - AiConfigV2.surplusApCostWeight * p.ApCost""",
              """            return scarcity + versatility + traits + handPressure + recurringApIncome\n                - AiConfigV2.surplusApCostWeight * p.ApCost""")

          # Once strict axis packing is done, unused slices become truly fungible. Give missions\n          # deferred ONLY for InsufficientBudget one second admission chance before topping up\n          # already-funded work. Recheck conflict, lane capacity and physical resources.
          marker = """            alloc.RemainderGenerated = new ResourceVector(remainder);\n\n            List<FundedEntry> topUpOrder = alloc.Funded"""
          spill = """            alloc.RemainderGenerated = new ResourceVector(remainder);\n\n            // 5b. Spillover admission: strict radar slices remain the first pass, but once their\n            // positive leftovers have explicitly lost axis identity, a mission deferred ONLY on\n            // InsufficientBudget gets one more admission attempt from the common remainder. This\n            // is not general overdraft: conflict/capacity/physical gates are rechecked and the\n            // mission receives only its executable AP minimum; ordinary top-up happens afterwards.\n            List<DeferredEntry> spillover = alloc.Deferred\n                .Where(d => d != null && d.Reason == DeferReason.InsufficientBudget && d.Mission != null)\n                .ToList();\n            foreach (DeferredEntry deferred in spillover)\n            {\n                if (remainder <= eps)\n                    break;\n\n                MissionProposal m = deferred.Mission;\n                float min = ApMinimum(m);\n                if (min <= eps || remainder + eps < min)\n                    continue;\n\n                ExecutionLane lane = MissionAdmissionPolicy.LaneFor(m);\n                bool conflict = lane != ExecutionLane.None\n                    && (alloc.Funded.Any(fe => fe.Mission != null\n                            && MissionAdmissionPolicy.LaneFor(fe.Mission) == lane\n                            && MissionAdmissionPolicy.Conflicts(fe.Mission, m))\n                        || _lockedClaims.Values.Any(lc => MissionAdmissionPolicy.LaneFor(lc.Mission) == lane\n                            && MissionAdmissionPolicy.Conflicts(lc.Mission, m)));\n                if (conflict || AtCapacity(lane))\n                    continue;\n\n                ResourceVector physMin = PhysicalMinimum(m);\n                if (physMin.AnyPhysical && !physicalRemaining.CoversPhysical(physMin, eps))\n                    continue;\n\n                var v = new ResourceVector(min);\n                var funded = new FundedEntry\n                {\n                    Mission = m,\n                    Priority = priority++,\n                    Tentative = v,\n                    IsCommitment = false,\n                    Stage = FundingStage.Remainder,\n                    RemainderTopUp = v,\n                    PhysicalDraw = physMin,\n                };\n                alloc.Funded.Add(funded);\n                alloc.Deferred.Remove(deferred);\n                remainder -= min;\n                alloc.RemainderSpent += v;\n                physicalRemaining = (physicalRemaining - physMin).ClampLow0();\n                alloc.PhysicalFunded += physMin;\n                ConsumeSlot(lane);\n\n                AiDebugLog.Write($\"[AI][V2] allocator spillover — FUND {StableMissionKey.For(m)} \"\n                    + $\"ap={LogNum(min)} from common remainder; left={LogNum(remainder)}\");\n            }\n\n            // Stage-4 starvation telemetry was computed before spillover existed. If every budget-\n            // starved fresh decision was just recovered, do not leave a stale starvation flag.\n            if (alloc.CommitmentsStarveFreshDecisions && alloc.Funded.Any(f => f.IsCommitment))\n            {\n                float minCommitBase = alloc.Funded.Where(f => f.IsCommitment).Min(f => f.Mission.BaseValue);\n                bool stillStarvedOnBudget = alloc.Deferred.Any(d => d.Reason == DeferReason.InsufficientBudget\n                    && d.Mission != null && d.Mission.BaseValue > minCommitBase);\n                bool stillStarvedOnCapacity = alloc.Deferred.Any(d => d.Reason == DeferReason.ExecutionCapacity)\n                    && alloc.Funded.Any(f => f.IsCommitment\n                        && MissionAdmissionPolicy.LaneFor(f.Mission) != ExecutionLane.None);\n                alloc.CommitmentsStarveFreshDecisions = stillStarvedOnBudget || stillStarvedOnCapacity;\n            }\n\n            List<FundedEntry> topUpOrder = alloc.Funded"""
          replace_once("Assets/Scripts/Ai/V2/ResourceAllocator.cs", marker, spill)
          replace_once(
              "Assets/Scripts/Ai/V2/ResourceAllocator.cs",
              """    //   3. Positive slice leftovers become one fungible REMAINDER pool that can only top up\n    //      ALREADY-funded missions toward Desired then Max. A deferred mission is never resurrected\n    //      by remainder, and remainder loses all axis identity once collected.""",
              """    //   3. Positive slice leftovers become one fungible REMAINDER pool. Missions deferred ONLY\n    //      for InsufficientBudget get one second admission pass from it (all non-budget gates are\n    //      rechecked); what remains then tops up funded missions toward Desired/Max.""")

          # Self-delete this one-shot workflow so the merged change contains only product code.
          wf = Path(".github/workflows/ai-v2-finish.yml")
          if wf.exists():
              wf.unlink()
          PY

          git diff --check
          git status --short

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai-v2): finish economy and AP reallocation logic"
          git push origin HEAD:fix/ai-v2-recon-strategy-loop
