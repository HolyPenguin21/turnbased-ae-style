name: Apply audited TaskScore patch once
on:
  push:
    branches: [audit/ai-v2-taskscore-2026-09-16]
    paths: ['.github/workflows/taskscore-one-shot.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ai-v2-taskscore-2026-09-16
          persist-credentials: true
      - name: Apply exact verified source edits and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import uuid
          def patch(name, old, new):
              file = Path(name)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{name}: expected one exact match, got {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))
              print('PATCHED', name)
          allocation = 'Assets/Scripts/Ai/V2/Allocation/ResourceAllocator.cs'
          patch(allocation, 'if (committedApSoFar + askAp > pool.Ap + eps)',
                'if (lockedTotal + committedApSoFar + askAp > pool.Ap + eps)')
          demand = 'Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs'
          patch(demand, '''                    float existingLoss = site.ConvertsOwnedExtractionSite
                        ? TaskScoreEvaluator.EconomicHexBenefit(site.LostExtractionIncome, 0f)
                        : 0f;''', '''                    // InfrastructureActions.TryFoundBase carries all existing extraction
                    // facilities into the new Base: there is no lost collection to penalize.
                    float existingLoss = 0f;''')
          patch(demand, '''float typeGain = StrategicCardEvaluator.BaseCardMarginalGain(
                            site.HexYield, card.Definition, type);''', '''float typeGain = StrategicCardEvaluator.BaseCardMarginalGain(
                            s, site, card.Definition, type);''')
          evaluation = 'Assets/Scripts/Ai/V2/Evaluation/Cards/StrategicCardEvaluator.cs'
          patch(evaluation, '''float marginalHexYield = BaseCardMarginalYield(site.HexYield, card.Definition);''',
                '''float marginalHexYield = BaseCardMarginalYield(s, site, card.Definition);''')
          patch(evaluation, '''        // `yield` is the hex's remaining UNCOLLECTED amount per type (structural site fact, see''', '''        // The card's actual marginal OWNER income must also subtract output already
        // harvested by our own armies. A Base can take their first cut without creating
        // any new income; IncomeProjection is the single owner of this physical rule.
        internal static float BaseCardMarginalYield(WorldSnapshot s, EconomyBaseOpportunity site,
            CardDefinition definition) => ResourceBundle.All.Sum(type =>
                BaseCardMarginalGain(s, site, definition, type));

        internal static float BaseCardMarginalGain(WorldSnapshot s, EconomyBaseOpportunity site,
            CardDefinition definition, ResourceType type)
        {
            int capacity = Mathf.RoundToInt(BaseCardMarginalGain(site.HexYield, definition, type));
            if (capacity <= 0)
                return 0f;
            int remainingYield = Mathf.RoundToInt(site.HexYield.Get(type));
            int ownArmyCollectors = Mathf.RoundToInt((s?.Self?.Armies
                ?? System.Array.Empty<ArmySnapshot>())
                .Where(a => a != null && a.Hex.Equals(site.Hex))
                .Sum(a => a.CollectionCapacity.Get(type)));
            bool armiesCanCollect = !(s?.Known?.EnemySightings
                ?? System.Array.Empty<Game.Ai.AiMapMemory.KnownEnemySighting>())
                .Any(enemy => enemy.Hex.Equals(site.Hex));
            // Existing building capacity was already subtracted in BaseUncollectedYield;
            // projecting over that remainder with zero previous capacity avoids subtracting
            // carried facilities twice and correctly captures displaced army collection.
            return IncomeProjection.MarginalOwnerCollectionAtHex(
                remainingYield, 0, capacity, ownArmyCollectors, armiesCanCollect);
        }

        // `yield` is the hex's remaining UNCOLLECTED amount per type (structural site fact, see''')
          test = Path('Assets/Editor/AiTaskScoreBaseIncomeRegressionTests.cs')
          if test.exists(): raise RuntimeError('Regression test already exists')
          test.write_text('''#if UNITY_INCLUDE_TESTS
using System.Collections.Generic;
using Game.Ai.V2;
using Game.Cards;
using Game.Economy;
using Game.HexGrid;
using Game.Map;
using NUnit.Framework;

namespace Game.EditorTests
{
    public class AiTaskScoreBaseIncomeRegressionTests
    {
        [Test]
        public void BaseDoesNotCountIncomeAlreadyCollectedByOwnArmy()
        {
            var hex = new HexCoord(2, -1);
            var type = ResourceType.Materials;
            var card = new CardDefinition { cardType = CardType.Base,
                grantedAbilities = new List<string> { UnitAbilities.CollectAbilityFor(type) } };
            var site = new EconomyBaseOpportunity { Hex = hex,
                HexYield = new ResourceBundle { Materials = 1 } };
            var snapshot = new WorldSnapshot { Self = new SelfSnapshot
            {
                Armies = new List<ArmySnapshot> { new ArmySnapshot
                {
                    Hex = hex, CollectionCapacity = new ResourceBundle { Materials = 1 }
                } }
            } };
            Assert.That(StrategicCardEvaluator.BaseCardMarginalGain(snapshot, site, card, type),
                Is.Zero, "the Base takes the same finite resource already harvested by our army");
            Assert.That(StrategicCardEvaluator.BaseCardMarginalYield(snapshot, site, card), Is.Zero);
            snapshot.Self.Armies = new List<ArmySnapshot>();
            Assert.That(StrategicCardEvaluator.BaseCardMarginalGain(snapshot, site, card, type),
                Is.EqualTo(1f));
            site.HexYield = new ResourceBundle { Materials = 2 };
            snapshot.Self.Armies = new List<ArmySnapshot> { new ArmySnapshot
            {
                Hex = hex, CollectionCapacity = new ResourceBundle { Materials = 1 }
            } };
            Assert.That(StrategicCardEvaluator.BaseCardMarginalGain(snapshot, site, card, type),
                Is.EqualTo(1f), "the Base can collect genuinely unharvested remainder");
        }

        [Test]
        public void BaseGainIsCardSpecificAndPerResourceAfterArmyCompetition()
        {
            var hex = new HexCoord(3, 0);
            var card = new CardDefinition { cardType = CardType.Base,
                grantedAbilities = new List<string>
                {
                    UnitAbilities.CollectAbilityFor(ResourceType.Materials),
                    UnitAbilities.CollectAbilityFor(ResourceType.Energy)
                } };
            var site = new EconomyBaseOpportunity { Hex = hex,
                HexYield = new ResourceBundle { Materials = 1, Energy = 2 } };
            var snapshot = new WorldSnapshot { Self = new SelfSnapshot
            {
                Armies = new List<ArmySnapshot> { new ArmySnapshot
                {
                    Hex = hex, CollectionCapacity = new ResourceBundle { Materials = 1 }
                } }
            } };
            Assert.That(StrategicCardEvaluator.BaseCardMarginalGain(snapshot, site, card,
                ResourceType.Materials), Is.Zero);
            Assert.That(StrategicCardEvaluator.BaseCardMarginalGain(snapshot, site, card,
                ResourceType.Energy), Is.EqualTo(1f));
            Assert.That(StrategicCardEvaluator.BaseCardMarginalYield(snapshot, site, card),
                Is.EqualTo(1f));
            Assert.That(IncomeProjection.MarginalOwnerCollectionAtHex(1, 0, 1, 1, true), Is.Zero);
        }

        [Test]
        public void MergeLegalityAllowsPreservingExistingExtractionFacilities()
        {
            var site = new BuildingData { HasTieredUnlock = false };
            var extraction = new CardDefinition { cardType = CardType.Facility,
                grantedAbilities = new List<string>
                {
                    UnitAbilities.CollectAbilityFor(ResourceType.Materials)
                } };
            site.FacilitySlots[0] = FacilityData.FromDefinition(extraction);
            Assert.That(site.CollectedAmount(ResourceType.Materials), Is.EqualTo(1));
            Assert.That(InfrastructureActions.CanMergeIntoResourceSite(site), Is.True);
            // TryFoundBase transfers this slot to the new building: the valuation must not
            // charge any lost income for a legal merge.
        }
    }
}
#endif
''')
          Path(str(test) + '.meta').write_text('fileFormatVersion: 2\nguid: ' + uuid.uuid4().hex + '\n')
          print('SOURCE_PATCHES_AND_REGRESSION_CREATED')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/taskscore-one-shot.yml
          git add Assets/Scripts/Ai/V2/Allocation/ResourceAllocator.cs Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs Assets/Scripts/Ai/V2/Evaluation/Cards/StrategicCardEvaluator.cs Assets/Editor/AiTaskScoreBaseIncomeRegressionTests.cs Assets/Editor/AiTaskScoreBaseIncomeRegressionTests.cs.meta
          git commit -m 'Fix locked AP and Base net income scoring with regression tests [skip ci]'
          git push origin HEAD:audit/ai-v2-taskscore-2026-09-16
