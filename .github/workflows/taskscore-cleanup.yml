name: Remove obsolete TaskScore formulas once
on:
  push:
    branches: [audit/ai-v2-taskscore-2026-09-16]
    paths: ['.github/workflows/taskscore-cleanup.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ai-v2-taskscore-2026-09-16
      - name: Strict reference-checked cleanup
        shell: bash
        run: |
          python3 .taskscore_cleanup_preflight_once.py
          python3 .taskscore_cleanup_once.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/taskscore-cleanup.yml .taskscore_cleanup_once.py .taskscore_cleanup_preflight_once.py
          git add -u Assets
          git commit -m 'Remove legacy TaskScore formulas and unify active evaluation [skip ci]'
          git push origin HEAD:audit/ai-v2-taskscore-2026-09-16
