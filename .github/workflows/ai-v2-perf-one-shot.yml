name: One-shot AI V2 redundant evaluation fixes
on:
  push:
    branches:
      - fix/ai-v2-repeated-evaluations-20260919
permissions:
  contents: write
jobs:
  apply-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply three isolated edits, validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Development.cs')
          s = p.read_text(encoding='utf-8')
          before = '''            if (root != null && hand != null)
                          devOpportunities = DevelopmentOpportunityEvaluator.Enumerate(
                              s, player, root, hand, null);'''
          after = '''            // Orchestration already computed and refreshed this list for the settled state.
                      // Enumerate here only for callers that did not supply it.
                      if (devOpportunities == null && root != null && hand != null)
                          devOpportunities = DevelopmentOpportunityEvaluator.Enumerate(
                              s, player, root, hand, null);'''
          assert s.count(before) == 1, 'Development fallback anchor changed'
          p.write_text(s.replace(before, after, 1), encoding='utf-8')
          assert p.read_text(encoding='utf-8').count('if (devOpportunities == null && root != null && hand != null)') == 1
          PY
          git diff --check
          git add -- Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Development.cs
          git commit -m 'perf(ai-v2): reuse orchestration Development opportunities in demands'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scripts/Ai/V2/Strategy/Objectives/ReconObjectiveEvaluator.cs')
          s = p.read_text(encoding='utf-8')
          def replace_once(old, new):
              global s
              assert s.count(old) == 1, f'Recon anchor changed: {old!r}'
              s = s.replace(old, new, 1)
          replace_once('            List<ReconObjective> refresh = BuildRefreshObjectives(snap);',
                       '            ReconDirectionSnapshot direction = null;\n            List<ReconObjective> refresh = BuildRefreshObjectives(snap, ref direction);')
          replace_once('                ReconAcceptanceAudit.RecordDirectionBoundary(auditPlayer, snap.TurnNumber,\n                    ReconDirectionModel.Build(snap));',
                       '                if (direction == null)\n                    direction = ReconDirectionModel.Build(snap);\n                ReconAcceptanceAudit.RecordDirectionBoundary(auditPlayer, snap.TurnNumber,\n                    direction);')
          replace_once('        private static List<ReconObjective> BuildRefreshObjectives(WorldSnapshot snap)\n',
                       '        private static List<ReconObjective> BuildRefreshObjectives(WorldSnapshot snap,\n            ref ReconDirectionSnapshot direction)\n')
          replace_once('                ReconObjective o = BuildRefresh(snap, kv.Key, age);',
                       '                if (direction == null)\n                    direction = ReconDirectionModel.Build(snap);\n                ReconObjective o = BuildRefresh(snap, kv.Key, age, direction: direction);')
          replace_once('        private static ReconObjective BuildRefresh(WorldSnapshot snap, HexCoord hex, int age,\n            int? preferredMoverArmyId = null)\n',
                       '        private static ReconObjective BuildRefresh(WorldSnapshot snap, HexCoord hex, int age,\n            int? preferredMoverArmyId = null, ReconDirectionSnapshot direction = null)\n')
          replace_once('            ReconDirectionSnapshot direction = ReconDirectionModel.Build(snap);',
                       '            direction = direction ?? ReconDirectionModel.Build(snap);')
          assert s.count('ReconDirectionModel.Build(snap)') == 3, 'Expected two enumeration lazy sites and one standalone fallback'
          assert 'return BuildRefresh(snap, hex, age, preferredMoverArmyId);' in s, 'Standalone RefreshAt lost'
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git add -- Assets/Scripts/Ai/V2/Strategy/Objectives/ReconObjectiveEvaluator.cs
          git commit -m 'perf(ai-v2): share Recon direction model across refresh objectives'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs')
          s = p.read_text(encoding='utf-8')
          def replace_once(old, new):
              global s
              assert s.count(old) == 1, f'Preparation anchor changed: {old!r}'
              s = s.replace(old, new, 1)
          replace_once('            ActorCommitments occupied = ActorCommitments.FromIntents(activeIntents, snap, null);\n            foreach (ResearchProductionMode mode',
                       '            ActorCommitments occupied = ActorCommitments.FromIntents(activeIntents, snap, null);\n            // One settled preparation evaluation has one immutable set of available sources.\n            // Keep site/mode-specific admission in the loop below, not in a global cache.\n            List<GenerationStep> generatedOperatorSources = null;\n            foreach (ResearchProductionMode mode')
          replace_once('                    generatedOperator = GenerationSource.Enumerate(player, root, ctx, hand,\n                            claimedUseKeys: null, triedCardKeys: null)\n                        .Where(g => IsGeneratedOperatorCandidate(g, mode)',
                       '                    if (generatedOperatorSources == null)\n                        generatedOperatorSources = GenerationSource.Enumerate(player, root, ctx, hand,\n                            claimedUseKeys: null, triedCardKeys: null);\n                    generatedOperator = generatedOperatorSources\n                        .Where(g => IsGeneratedOperatorCandidate(g, mode)')
          assert s.count('generatedOperatorSources = GenerationSource.Enumerate(') == 1
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git add -- Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs
          git commit -m 'perf(ai-v2): enumerate generation sources once per preparation pass'
          # The workflow only transports the patches; remove it from the PR's final diff.
          rm -- .github/workflows/ai-v2-perf-one-shot.yml
          git add -u -- .github/workflows/ai-v2-perf-one-shot.yml
          git commit -m 'chore: remove one-shot patch transport workflow'
          git status --short
          git diff --check HEAD~4 HEAD
          git push origin HEAD:fix/ai-v2-repeated-evaluations-20260919