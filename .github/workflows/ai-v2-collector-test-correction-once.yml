name: Correct collector marginal test expectation once
on:
  push:
    branches: [fix/ai-v2-collector-facility-slot-separation]
    paths: [.github/workflows/ai-v2-collector-test-correction-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct a verified regression expectation and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Editor/AiEconomyDecisionTests.cs')
          s=p.read_text(encoding='utf-8')
          old='''        [TestCase(3, 0, 2, true, 0, 1)]
          [TestCase(3, 0, 2, false, 1, 0)]'''
          new='''        [TestCase(3, 0, 2, true, 1, 1)]
          [TestCase(3, 0, 2, false, 1, 0)]'''
          assert s.count(old)==1, f'expected unique test case: {s.count(old)}'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('PASS: when 2/3 yield is collected by armies, either added source contributes the remaining +1; contested case stays facility +1, collector +0')
          PY
          git rm -- .github/workflows/ai-v2-collector-test-correction-once.yml
          git add -- Assets/Editor/AiEconomyDecisionTests.cs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ai-v2): correct finite-yield marginal expectation'
          git push origin HEAD:fix/ai-v2-collector-facility-slot-separation
