name: Correct collector marginal test expectation once
on:
  push:
    branches: [fix/ai-v2-collector-facility-slot-separation]
    paths: [.github/workflows/ai-v2-collector-test-correction-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct test expectation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Editor/AiEconomyDecisionTests.cs')
          s = p.read_text(encoding='utf-8')
          old = '[TestCase(3, 0, 2, true, 0, 1)]'
          new = '[TestCase(3, 0, 2, true, 1, 1)]'
          assert s.count(old) == 1, f'unexpected anchor count {s.count(old)}'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('PASS: facility and collector both add +1 to the unclaimed third slice')
          PY
          git rm -- .github/workflows/ai-v2-collector-test-correction-once.yml
          git add -- Assets/Editor/AiEconomyDecisionTests.cs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ai-v2): correct finite-yield marginal expectation'
          git push origin HEAD:fix/ai-v2-collector-facility-slot-separation
