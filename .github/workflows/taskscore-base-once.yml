name: One-time Base TaskScore correction
on:
  push:
    branches: [refactor/unified-task-score]
permissions:
  contents: write
jobs:
  correct-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-task-score
          fetch-depth: 2
      - name: Require reviewed starting point
        run: |
          test "$(git rev-parse HEAD^)" = "517f40fbd81f6b07ba19819fc8c5fa1c726d7252"
      - name: Apply narrowly scoped Base edits with exact matching
        env:
          PAYLOAD: 
        run: python3 -c 'import os,base64,zlib; exec(zlib.decompress(base64.b64decode(os.environ["PAYLOAD"])) .decode())'
      - name: Check exact scope and commit code only
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected={'Assets/Scripts/Ai/V2/Evaluation/Cards/StrategicCardEvaluator.cs','Assets/Scripts/Ai/V2/Evaluation/TaskScore.cs','Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs','Assets/Editor/AiUnifiedTaskScoreTests.cs'}
          assert changed==expected,(changed,expected)
          print('Exact scoped modifications:',len(changed))
          PY
          rm .github/workflows/taskscore-base-once.yml
          git add Assets/Scripts/Ai/V2/Evaluation/Cards/StrategicCardEvaluator.cs Assets/Scripts/Ai/V2/Evaluation/TaskScore.cs Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs Assets/Editor/AiUnifiedTaskScoreTests.cs .github/workflows/taskscore-base-once.yml
          git diff --cached --check
          git config user.name 'TaskScore Refactor'
          git config user.email 'taskscore-refactor@users.noreply.github.com'
          git commit -m 'Fix Base per-resource marginal scoring and useful-site staging'
          git push origin HEAD:refactor/unified-task-score