name: Temporary Raid actor ownership fix
on:
  push:
    branches: [fix/raid-actor-commitment-20260916]
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply ownership fix and add Unity EditMode regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, got {count}: {old[:110]!r}')
              p.write_text(text.replace(old, new, 1))

          prov = 'Assets/Scripts/Ai/V2/Provisioning/ProvisioningManager.cs'
          replace(prov,
              '''        private readonly Dictionary<StableMissionKey, int> _raidAssignment =
            new Dictionary<StableMissionKey, int>();
''',
              '''        private readonly Dictionary<StableMissionKey, int> _raidAssignment =
            new Dictionary<StableMissionKey, int>();
        // The SAME ownership constraints used for Raid batch assignment must survive into
        // RaidProvisioner (including its same-hex donors). They are refreshed on every repack.
        private ActorCommitments _raidDurableCommitments;
        private HashSet<int> _raidPinnedByOtherLegs = new HashSet<int>();
''')
          replace(prov,
              '''        internal void SetRaidAssignment(Dictionary<StableMissionKey, int> a)
        {
            _raidAssignment.Clear();
            foreach (KeyValuePair<StableMissionKey, int> kv in a)
                _raidAssignment[kv.Key] = kv.Value;
        }
''',
              '''        internal void SetRaidConstraints(ActorCommitments durableCommitments,
            ISet<int> pinnedByOtherLegs)
        {
            _raidDurableCommitments = durableCommitments;
            _raidPinnedByOtherLegs = pinnedByOtherLegs == null
                ? new HashSet<int>() : new HashSet<int>(pinnedByOtherLegs);
        }

        // Single Raid ownership read, shared by batch assignment AND final binding.
        // A durable Raid may use its own incumbent, but never another mission's army;
        // exclusions also apply to donors, not merely the primary host.
        internal HashSet<int> ExcludedForRaid(MissionProposal proposal)
        {
            var excluded = new HashSet<int>(ClaimedArmyIds);
            excluded.UnionWith(_raidPinnedByOtherLegs);
            if (_raidDurableCommitments != null)
                foreach (int id in _raidDurableCommitments.ClaimedArmyIds)
                    if (proposal == null || !proposal.FromDurableIntent
                        || proposal.PreferredMoverArmyId != id)
                        excluded.Add(id);
            return excluded;
        }

        internal void SetRaidAssignment(Dictionary<StableMissionKey, int> a)
        {
            _raidAssignment.Clear();
            foreach (KeyValuePair<StableMissionKey, int> kv in a)
                _raidAssignment[kv.Key] = kv.Value;
        }
''')
          replace(prov,
              '''            open.Sort((a, b) => a.Priority.CompareTo(b.Priority));

            var cands = new List<List<int>>(open.Count);
            foreach (FundedEntry fe in open)
            {
                var ids = new List<int>();
                if (GroundCombatAdmissionRegistry.TryGet(fe.Mission, out HashSet<int> eligible))
                    ids.AddRange(eligible
                        .Where(id => !session.ClaimedArmyIds.Contains(id)
                            && !pinnedByOtherLegs.Contains(id)
                            // A free support/assault actor may not be stolen from another durable
                            // Recon/Economy/Raid operation. The only exception is this proposal's
                            // own pinned incumbent primary, which must remain executable.
                            && (durableCommitments == null
                                || !durableCommitments.IsArmyClaimed(id)
                                || (fe.Mission.FromDurableIntent
                                    && fe.Mission.PreferredMoverArmyId == id)))
                        .OrderBy(id => RaidActorActivation(session.Snapshot, id))
                        .ThenBy(id => RaidActorPower(session.Snapshot, id))
                        .ThenBy(id => id));
                cands.Add(ids);
            }
''',
              '''            open.Sort((a, b) => a.Priority.CompareTo(b.Priority));

            session.SetRaidConstraints(durableCommitments, pinnedByOtherLegs);
            var cands = new List<List<int>>(open.Count);
            foreach (FundedEntry fe in open)
            {
                HashSet<int> excluded = session.ExcludedForRaid(fe.Mission);
                var ids = new List<int>();
                if (GroundCombatAdmissionRegistry.TryGet(fe.Mission, out HashSet<int> eligible))
                    ids.AddRange(eligible
                        .Where(id => !excluded.Contains(id))
                        .OrderBy(id => RaidActorActivation(session.Snapshot, id))
                        .ThenBy(id => RaidActorPower(session.Snapshot, id))
                        .ThenBy(id => id));
                cands.Add(ids);
            }
''')
          replace(prov,
              '''            GroundCombatAssemblyPlan plan = null;
            if (session.TryGetAssignedRaidActor(key, out int assignedActor)
                && !session.ClaimedArmyIds.Contains(assignedActor))
            {
                GroundCombatAssemblyPlan assigned = GroundCombatAssemblyPlanner.PlanForArmy(snap, target, defenders, assignedActor);
                if (assigned.Feasible) plan = assigned;
            }
            if (plan == null)
                plan = GroundCombatAssemblyPlanner.Plan(snap, target, defenders, session.ClaimedArmyIds);

            if (!plan.Feasible)
            {
                GroundCombatAssemblyPlan unrestricted = GroundCombatAssemblyPlanner.Plan(snap, target, defenders, null);
                if (unrestricted.Feasible)
                    return ProvisioningResult.Fail(ProvisionFailure.MoverContended(
                        $"raid target {raidTarget.DiagnosticLabel} has an executable force but its host/donor is already claimed; {plan.Reason}"));
                return ProvisioningResult.Fail(ProvisionFailure.AssemblyInfeasible(plan.Reason));
            }
''',
              '''            // Do not re-run a FREE army search here: the batch assignment already
            // rejected armies owned by Economy/Recon/other Raids. Re-plan ONLY the assigned
            // host, allowing legal same-hex assembly with that same ownership exclusion set.
            GroundCombatAssemblyPlan plan = PlanAssignedAssault(session, m, defenders,
                out ProvisionFailure assignmentFailure);
            if (plan == null)
                return ProvisioningResult.Fail(assignmentFailure);
''')
          replace(prov,
              '''        // =====================================================================================
        //  AGG-RAID §9/§SupportReturn — RETURN leg. Mover is the primary (Return) or the support
''',
              '''        // A single binding path for assault, used by both the real Provision method and
        // regression tests. The batch solver owns actor identity; the combat assembly kernel
        // owns feasibility of THAT actor and donors, never a replacement actor search.
        internal static GroundCombatAssemblyPlan PlanAssignedAssault(ProvisioningSession session,
            MissionProposal proposal, IReadOnlyList<WorthIt.DefenderProfile> defenders,
            out ProvisionFailure failure)
        {
            failure = default;
            StableMissionKey key = StableMissionKey.For(proposal);
            if (!session.TryGetAssignedRaidActor(key, out int actorId))
            {
                failure = ProvisionFailure.MoverContended(
                    $"raid {key} has no actor in the shared ground-combat assignment");
                return null;
            }

            HashSet<int> excluded = session.ExcludedForRaid(proposal);
            if (excluded.Contains(actorId))
            {
                failure = ProvisionFailure.MoverContended(
                    $"raid {key} assigned actor #{actorId} is claimed by another mission");
                return null;
            }

            // Preserve existing PlanForArmy's continuation win floor for the assigned actor.
            // Fresh candidates already passed the strict gate in GroundCombatAdmissionRegistry;
            // unlike PlanForArmy, this request can also assemble a legal same-hex roster.
            GroundCombatAssemblyPlan plan = GroundCombatAssemblyPlanner.Plan(session.Snapshot,
                new GroundCombatAssemblyRequest
                {
                    Defenders = defenders,
                    PreferredPrimaryArmyId = actorId,
                    PinToPreferred = true,
                    ExcludedArmyIds = excluded,
                    WinChanceGate = RaidAdmissionPolicy.ContinuationWinChanceFloor,
                });
            if (!plan.Feasible)
            {
                // The actor was admitted by the strict proposal-side registry. Rejection now
                // is transient (e.g. a donor became unavailable), not target infeasibility.
                failure = ProvisionFailure.MoverContended(
                    $"raid {key} assigned actor #{actorId} / eligible donors unavailable: {plan.Reason}");
                return null;
            }
            return plan;
        }

        // =====================================================================================
        //  AGG-RAID §9/§SupportReturn — RETURN leg. Mover is the primary (Return) or the support
''')
          replace(prov,
              '''            if (session.ClaimedArmyIds.Contains(support.Id))
                return ProvisioningResult.Fail(ProvisionFailure.MoverContended(
                    $"raid reinforcement support #{support.Id} was claimed by an earlier mission this cycle"));
''',
              '''            if (session.ExcludedForRaid(funded.Mission).Contains(support.Id))
                return ProvisioningResult.Fail(ProvisionFailure.MoverContended(
                    $"raid reinforcement support #{support.Id} is claimed by another mission or Raid leg"));
''')

          agg = 'Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs'
          replace(agg,
              '''            var fresh = new List<RaidCandidate>();
            foreach (AggressionObjective o in objectives)
                fresh.Add(ToCandidate(snap, o, breakdown));
''',
              '''            // TaskScore must not price a fresh Raid using an actor another durable
            // mission already owns. Ownership itself is a feasibility gate, not a fake
            // opportunity-cost number subtracted from every competing mission.
            ISet<int> committed = ActorCommitments.FromIntents(
                activeIntents?.Where(i => i != null && i.Status == IntentStatus.Active),
                snap, null).ClaimedArmyIdSet;
            var fresh = new List<RaidCandidate>();
            foreach (AggressionObjective o in objectives)
                fresh.Add(ToCandidate(snap, o, breakdown, unavailableArmyIds: committed));
''')
          replace(agg,
              '''                    incumbents.Add(ToCandidate(snap, o, breakdown,
                            intent.PreferredMoverArmyId, intent.Raid.OperationStarted)
''',
              '''                    incumbents.Add(ToCandidate(snap, o, breakdown,
                            intent.PreferredMoverArmyId, intent.Raid.OperationStarted,
                            unavailableArmyIds: committed)
''')
          replace(agg,
              '''                MissionProposal p = BuildProposal(snap, c);
''',
              '''                MissionProposal p = BuildProposal(snap, c, committed);
''')
          replace(agg,
              '''            DesireBreakdown bd, int? pinnedPrimaryArmyId = null, bool operationStarted = false)
        {
            RaidMissionTarget target = o.ToTarget();
''',
              '''            DesireBreakdown bd, int? pinnedPrimaryArmyId = null, bool operationStarted = false,
            ISet<int> unavailableArmyIds = null)
        {
            // An incumbent may retain ITS OWN claimed primary, never any other claimant.
            ISet<int> excluded = unavailableArmyIds;
            if (pinnedPrimaryArmyId.HasValue && unavailableArmyIds != null)
            {
                var ownExcluded = new HashSet<int>(unavailableArmyIds);
                ownExcluded.Remove(pinnedPrimaryArmyId.Value);
                excluded = ownExcluded;
            }
            RaidMissionTarget target = o.ToTarget();
''')
          replace(agg,
              '''                    WinChanceGate = operationStarted
                        ? RaidAdmissionPolicy.ContinuationWinChanceFloor
                        : RaidAdmissionPolicy.FreshStartWinChanceGate,
                })
                : GroundCombatAssemblyPlanner.Plan(snap, target, defenders, null);
''',
              '''                    WinChanceGate = operationStarted
                        ? RaidAdmissionPolicy.ContinuationWinChanceFloor
                        : RaidAdmissionPolicy.FreshStartWinChanceGate,
                    ExcludedArmyIds = excluded,
                })
                : GroundCombatAssemblyPlanner.Plan(snap, target, defenders, excluded);
''')
          replace(agg,
              '''        private static MissionProposal BuildProposal(WorldSnapshot snap, RaidCandidate c)
        {
            int? pricedMover = c.PreferredMover ?? c.CostedMover;
''',
              '''        private static MissionProposal BuildProposal(WorldSnapshot snap, RaidCandidate c,
            ISet<int> unavailableArmyIds)
        {
            var excluded = unavailableArmyIds == null
                ? new HashSet<int>() : new HashSet<int>(unavailableArmyIds);
            if (c.IsIncumbent && c.PreferredMover.HasValue)
                excluded.Remove(c.PreferredMover.Value);
            int? pricedMover = c.PreferredMover ?? c.CostedMover;
''')
          replace(agg,
              '''                GroundCombatAdmissionRegistry.Record(proposal, snap);
''',
              '''                GroundCombatAdmissionRegistry.Record(proposal, snap, excluded);
''')
          registry = 'Assets/Scripts/Ai/V2/State/GroundCombatAdmissionRegistry.cs'
          replace(registry,
              '''        public static void Record(MissionProposal proposal, WorldSnapshot snap)
''',
              '''        public static void Record(MissionProposal proposal, WorldSnapshot snap,
            ISet<int> unavailableArmyIds = null)
''')
          replace(registry,
              '''            var excluded = new HashSet<int>();
            var ids = new List<int>();
''',
              '''            var excluded = unavailableArmyIds == null
                ? new HashSet<int>() : new HashSet<int>(unavailableArmyIds);
            var ids = new List<int>();
''')

          test = Path('Assets/Editor/AiRaidActorCommitmentTests.cs')
          if test.exists():
              raise RuntimeError(f'test already exists: {test}')
          test.write_text('''#if UNITY_INCLUDE_TESTS
using System;
using System.Collections.Generic;
using Game.Ai.V2;
using Game.Combat;
using Game.HexGrid;
using NUnit.Framework;

namespace Game.EditorTests
{
    public class AiRaidActorCommitmentTests
    {
        private static MissionProposal Assault(int targetId = 42) => new MissionProposal
        {
            Kind = MissionKind.Raid,
            Target = new RaidMissionTarget { Target = RaidTargetRef.ForNeutralArmy(targetId) },
        };

        [Test]
        public void UnassignedRaid_DoesNotFallBackToFreeArmySearch()
        {
            var snap = new WorldSnapshot { Self = new SelfSnapshot
            {
                Armies = new List<ArmySnapshot> { new ArmySnapshot
                {
                    ArmyId = 9, IsStructuralRaidActor = true, MemberCount = 1,
                    CurrentMovement = 3, Members = Array.Empty<WorthIt.DefenderProfile>(),
                } },
            } };
            var session = new ProvisioningSession(snap);
            var mission = Assault();
            var claimed = new ActorCommitments();
            claimed.Claim(9); // Economy owns the only viable ground actor.
            session.SetRaidConstraints(claimed, new HashSet<int>());

            GroundCombatAssemblyPlan plan = RaidProvisioner.PlanAssignedAssault(
                session, mission, Array.Empty<WorthIt.DefenderProfile>(), out ProvisionFailure failure);

            Assert.That(plan, Is.Null);
            Assert.That(failure.Kind, Is.EqualTo(ProvisionFailureKind.MoverContended));
            Assert.That(session.ExcludedForRaid(mission), Does.Contain(9));
        }

        [Test]
        public void AssignedRaid_RejectsActorThatBecameDurablyClaimed()
        {
            var session = new ProvisioningSession(new WorldSnapshot());
            MissionProposal mission = Assault();
            session.SetRaidAssignment(new Dictionary<StableMissionKey, int>
            {
                { StableMissionKey.For(mission), 9 },
            });
            var claimed = new ActorCommitments();
            claimed.Claim(9);
            session.SetRaidConstraints(claimed, new HashSet<int>());

            GroundCombatAssemblyPlan plan = RaidProvisioner.PlanAssignedAssault(
                session, mission, Array.Empty<WorthIt.DefenderProfile>(), out ProvisionFailure failure);

            Assert.That(plan, Is.Null);
            Assert.That(failure.Kind, Is.EqualTo(ProvisionFailureKind.MoverContended));
        }

        [Test]
        public void IncumbentExemptsOnlyItsOwnActor_NotOtherMissionsOrDonors()
        {
            var session = new ProvisioningSession(new WorldSnapshot());
            MissionProposal incumbent = Assault();
            incumbent.FromDurableIntent = true;
            incumbent.PreferredMoverArmyId = 9;
            var claimed = new ActorCommitments();
            claimed.Claim(9);
            claimed.Claim(10); // Other Economy/Recon operation, including donor eligibility.
            session.SetRaidConstraints(claimed, new HashSet<int> { 11 });

            HashSet<int> excluded = session.ExcludedForRaid(incumbent);
            Assert.That(excluded, Does.Not.Contain(9));
            Assert.That(excluded, Does.Contain(10));
            Assert.That(excluded, Does.Contain(11));
            session.ClaimedArmyIds.Add(12);
            Assert.That(session.ExcludedForRaid(incumbent), Does.Contain(12));
        }

        [Test]
        public void AdmissionExcludesCommittedActor_BeforeRaidFunding()
        {
            var snap = new WorldSnapshot { Self = new SelfSnapshot
            {
                Armies = new List<ArmySnapshot> { new ArmySnapshot
                {
                    ArmyId = 9, IsStructuralRaidActor = true, MemberCount = 1,
                    CurrentMovement = 3, Members = Array.Empty<WorthIt.DefenderProfile>(),
                } },
            } };
            MissionProposal mission = Assault();
            GroundCombatAdmissionRegistry.Record(mission, snap, new HashSet<int> { 9 });
            Assert.That(GroundCombatAdmissionRegistry.EligibleIds(mission), Is.EqualTo("none"));
        }
    }
}
#endif
''')
          meta = Path(str(test) + '.meta')
          if meta.exists(): raise RuntimeError('test meta already exists')
          meta.write_text('fileFormatVersion: 2\nguid: d63850c7992c4509bb25ce90acb8f191\n')

          # Prove the old unrestricted fallback is gone and the exact-assignment path is wired.
          content = Path(prov).read_text()
          assert 'plan = GroundCombatAssemblyPlanner.Plan(snap, target, defenders, session.ClaimedArmyIds)' not in content
          assert 'GroundCombatAssemblyPlan plan = PlanAssignedAssault(session, m, defenders,' in content
          assert 'ExcludedArmyIds = excluded,' in content
          assert Path(registry).read_text().count('new HashSet<int>(unavailableArmyIds)') == 1
          print('PASS: 4 guarded source patches, assigned-only Raid binding, donor exclusions and 4 Unity EditMode regressions staged')
          PY
          git diff --check
          git status --short
          git add Assets/Scripts/Ai/V2/Provisioning/ProvisioningManager.cs Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs Assets/Scripts/Ai/V2/State/GroundCombatAdmissionRegistry.cs Assets/Editor/AiRaidActorCommitmentTests.cs Assets/Editor/AiRaidActorCommitmentTests.cs.meta
          git rm .github/workflows/temporary-raid-actor-fix-20260916.yml
          git -c user.name='Raid Fix Bot' -c user.email='raid-fix-bot@users.noreply.github.com' commit -m 'fix(ai): preserve Raid actor commitments through scoring and provisioning'
          git push origin HEAD:fix/raid-actor-commitment-20260916
