name: Package Army Destruction Images
on:
  push:
    branches: [feature/army-destruction-export]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-images:
    if: "!contains(github.event.head_commit.message, '[skip export]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pillow
        run: python -m pip install pillow==11.3.0
      - name: Pack four game atlases, separated PNG frames and GIF previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('Assets/Resources/ArmyDestruction')
          previews = Path('Docs/Previews')
          out = Path('Docs/Exports/ArmyDestruction_Images.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=8) as z:
              for name in ('GroundBase','GroundAccent','AirBase','AirAccent'):
                  image_path = root / (name+'.png')
                  z.write(image_path, 'Atlases/'+image_path.name)
                  with Image.open(image_path) as sheet:
                      assert sheet.size == (1280,320)
                      for index in range(16):
                          x=(index%8)*160
                          y=(index//8)*160
                          from io import BytesIO
                          frame=sheet.crop((x,y,x+160,y+160))
                          buf=BytesIO()
                          frame.save(buf,'PNG')
                          z.writestr('Frames/'+name+'/'+f'{name}_{index:02d}.png',buf.getvalue())
              for name in ('ArmyDestruction_Ground.gif','ArmyDestruction_Air.gif'):
                  z.write(previews/name,'Previews/'+name)
              z.writestr('README.txt',
                         'Rustmarch army destruction flipbooks: 16 frames per layer, 160x160 pixels, 2 seconds.\\n'
                         'GroundBase + GroundAccent: ground army. AirBase + AirAccent: air army.\\n'
                         'Source in Unity: Assets/Resources/ArmyDestruction/\\n'
                         'The faction-accent layer is tinted by player color at runtime.\\n')
          print(out, out.stat().st_size)
          PY
      - name: Commit archive to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Exports/ArmyDestruction_Images.zip
          if ! git diff --cached --quiet; then
            git commit -m "Bundle army destruction sprites for download [skip export]"
            git push origin HEAD:feature/army-destruction-export
          fi
