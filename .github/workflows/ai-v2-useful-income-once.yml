name: AI V2 useful marginal income test audit
on:
  push:
    branches:
      - fix/economy-useful-marginal-income
permissions:
  contents: read
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all economy scoring test consumers
        shell: bash
        run: |
          set -euo pipefail
          echo '== EconomyDemand tests and fixtures =='
          grep -RnE 'EconomyDemands\(|new EconomyResourceStanding|SnapshotWithDeficits\(' Assets/Editor/AiEconomyDecisionTests.cs | head -130
          echo '== Other EconomyDemands test files =='
          grep -Rl 'EconomyDemands(' Assets/Editor | head -35
          echo '== Any duplicate useful gain conversion =='
          grep -Rn 'UsefulMarginalIncomeGain' Assets/Scripts/Ai/V2
          echo '== whitespace =='
          git diff --check HEAD
          echo 'PASS: static scan finished'