name: Temporary Raid final validation
on:
  push:
    branches: [fix/raid-actor-commitment-20260916]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply guarded fix and parse Unity C-sharp sources
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temporary-raid-reinforcement-guard-20260916.py
          git diff --check
          python3 .github/temporary-raid-syntax-check-20260916.py
          git add Assets/Scripts/Ai/V2/Provisioning/ProvisioningManager.cs Assets/Editor/AiRaidActorCommitmentTests.cs
          git rm .github/temporary-raid-reinforcement-guard-20260916.py .github/temporary-raid-syntax-check-20260916.py .github/workflows/temporary-raid-final-validation-20260916.yml
          git -c user.name='Raid Fix Bot' -c user.email='raid-fix-bot@users.noreply.github.com' commit -m 'fix(ai): preserve own pinned Raid reinforcement while blocking foreign claims'
          git push origin HEAD:fix/raid-actor-commitment-20260916
