name: Scoped AI V2 investment follow-up
on:
  push:
    branches:
      - ai-v2/production-development-calibration
    paths:
      - .github/workflows/ai-v2-investment-followup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact source and apply only the reviewed investment changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'ai-v2/production-development-calibration'
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          sources = {
              'Assets/Editor/AiIndependentDevelopmentTests.cs': 'd0c68c43499199aa30a97f6b9b5718da385230d8',
              'Assets/Scripts/Ai/V2/Materialization/MaterializationChainEnumerator.cs': '4a6a4e43639735cfa968ad2883e574c1ac9cca99',
              'Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs': '897c3bb35778081536c61238ff13cec6926d168a',
              'Assets/Scripts/Ai/V2/Strategy/StrategicMaintenancePolicy.cs': 'fd5201b4d276b7ab16490747562a8d7ebc841ad4',
          }
          import subprocess
          for path, expected in sources.items():
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual != expected:
                  raise SystemExit(f'Source changed: {path} expected {expected} actual {actual}')
          segments = [Path(f'.github/ai-v2-investment-part-{i}.txt').read_text().strip() for i in range(4)]
          if list(map(len,segments)) != [1800,1800,1800,200]:
              raise SystemExit('Transport segment length mismatch')
          patch = gzip.decompress(base64.b64decode(''.join(segments),validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = 'af7d157be9927ba18d31b64b0fad261ba2e2ab7b273474fdeeaae7d5b8b63240'
          if digest != expected:
              raise SystemExit(f'Patch SHA-256 mismatch: {digest}')
          Path('/tmp/ai-v2-investment.patch').write_bytes(patch)
          print(f'Verified exact four-file patch: {digest} bytes={len(patch)}')
          PY
          git apply --check /tmp/ai-v2-investment.patch
          git apply /tmp/ai-v2-investment.patch
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'Assets/Editor/AiIndependentDevelopmentTests.cs',
              'Assets/Scripts/Ai/V2/Materialization/MaterializationChainEnumerator.cs',
              'Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs',
              'Assets/Scripts/Ai/V2/Strategy/StrategicMaintenancePolicy.cs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Unexpected changed paths: {changed ^ expected}')
          print('Four expected source files only; no additional architecture changes')
          PY
          git config user.name 'ai-v2-scoped-patch'
          git config user.email 'ai-v2-scoped-patch@users.noreply.github.com'
          git add -- Assets/Editor/AiIndependentDevelopmentTests.cs Assets/Scripts/Ai/V2/Materialization/MaterializationChainEnumerator.cs Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs Assets/Scripts/Ai/V2/Strategy/StrategicMaintenancePolicy.cs
          git rm -f -- .github/ai-v2-investment-part-0.txt .github/ai-v2-investment-part-1.txt .github/ai-v2-investment-part-2.txt .github/ai-v2-investment-part-3.txt .github/workflows/ai-v2-investment-followup.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(ai-v2): independently value deployable production and capacity unlock [skip ci]'
          git push origin HEAD:ai-v2/production-development-calibration
# Execution initiated only after all transport segments were saved and verified locally.