name: Verify Army Destruction Flipbooks
on:
  pull_request:
    paths:
      - Assets/Scripts/Map/ArmyDestructionEffect.cs
      - Assets/Editor/Tests/Map/ArmyDestructionEffectTests.cs
      - Assets/Resources/ArmyDestruction/**
      - Assets/Textures/Game/General/Armies/MapObject_Army_*.png
      - Tools/army-destruction/**
      - .github/workflows/army-destruction-flipbook.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification dependencies
        run: python -m pip install pillow==11.3.0 numpy==2.3.2
      - name: Validate frame atlases, alpha, metadata and previews against game sprites
        run: python Tools/army-destruction/generate.py --check
