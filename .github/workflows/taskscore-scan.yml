name: Scan TaskScore legacy references once
on:
  push:
    branches: [audit/ai-v2-taskscore-2026-09-16]
    paths: ['.github/workflows/taskscore-scan.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ai-v2-taskscore-2026-09-16
      - name: Find production references before cleanup
        shell: bash
        run: |
          for symbol in economySiteDeficitValue NearbyResourceClusterValue EconomyResourceClusterValue economyResourceClusterRadius BaseSpacingScore SpacingScore economyBaseSpacingValue economyBaseIdealSpacing economyBaseSpacingScoreAtMin economyBaseSpacingDecayPerHex BaseSiteValue ScoreBaseSite ReasonValue IntrinsicBuildCost ExtractionLossPenalty StrategicValue BaseHexYieldValue HomeDistance BaseCardMarginalYield BaseCardMarginalGain; do
            echo "====== $symbol ======";
            git grep -n -w "$symbol" -- 'Assets/**/*.cs' || true;
          done
          echo '====== unit abilities ======'
          git grep -n 'class UnitAbilities' -- 'Assets/**/*.cs' || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/taskscore-scan.yml
          git commit -m 'Remove one-shot TaskScore reference scan [skip ci]'
          git push origin HEAD:audit/ai-v2-taskscore-2026-09-16
