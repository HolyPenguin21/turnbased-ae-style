name: AI V2 remove base wait urgency one shot
on:
  push:
    branches:
      - fix/remove-base-wait-urgency
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove urgency at its only owners and update regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Assets')
          changed = []
          def edit(path, transform):
              f = root / path
              original = f.read_text(encoding='utf-8')
              result = transform(original)
              assert result != original, f'no change: {path}'
              f.write_text(result, encoding='utf-8')
              changed.append(str(f))
          def rep(s, old, new, count=1):
              assert s.count(old) == count, f'expected {count}, got {s.count(old)} for: {old[:100]!r}'
              return s.replace(old, new)
          def cut(s, beginning, ending, replacement=''):
              assert s.count(beginning) == 1, ('start', beginning, s.count(beginning))
              assert s.count(ending) == 1, ('end', ending, s.count(ending))
              a, b = s.index(beginning), s.index(ending)
              assert a < b, (beginning, ending)
              return s[:a] + replacement + s[b:]
          def method(s, name, replacement=None, body_edit=None):
              marker = '\n        [Test]\n        public void ' + name + '('
              assert s.count(marker) == 1, name
              a = s.index(marker)
              b = s.find('\n        [Test]', a + len(marker))
              assert b >= 0, ('no next test', name)
              original = s[a:b]
              value = body_edit(original) if body_edit else ('\n' + replacement if replacement else '')
              return s[:a] + value + s[b:]

          def demand(s):
              s = rep(s, '.ThenByDescending(x => x.Value + x.EconomyStrategicUrgency)', '.ThenByDescending(x => x.Value)')
              s = rep(s, '.ThenByDescending(d => d.Value + d.EconomyStrategicUrgency)', '.ThenByDescending(d => d.Value)')
              s = rep(s, '            EconomyStrategicUrgency = source.EconomyStrategicUrgency,\n', '')
              s = rep(s, '                MissionIntentRegistry.GetOrCreate(player)\n                    .MarkBaseExpansionCandidate(s.TurnNumber, null, null,\n                        structurallyEligible: false);\n', '')
              s = rep(s, '                    // Staging is about positive physical/strategic purpose, NOT present-day net\n                    // profitability: delivery/card costs may be overcome by future wait urgency.\n                    // Generic proximity alone must never stage a completely empty Base.\n', '                    // Require genuine physical/strategic purpose before admitting a new Base.\n                    // Generic proximity alone must not create an empty Base objective.\n')
              s = cut(s, '            AxisDemand stagedBase = meaningfulDemands\n', '            foreach (AxisDemand demand in meaningfulDemands)\n')
              s = cut(s, '                bool staged = stagedBase != null\n', '                bool committed = IsActiveBaseCommitment(\n')
              s = rep(s, '                bool admitted = committed || demand.Value + candidateUrgency\n                    >= AiConfigV2.economyBaseDemandMinValue;', '                // Do not turn negative net benefit into a new mission through elapsed time.\n                bool admitted = committed || demand.Value > AiConfigV2.allocatorSliceEpsilon;')
              s = rep(s, '                    + $"value={demand.Value:0.##} urgency={candidateUrgency:0.##} "', '                    + $"value={demand.Value:0.##} "')
              s = rep(s, '                    else if (demand.Value <= AiConfigV2.allocatorSliceEpsilon)\n                        deliveryValueRejected++;\n                    else\n                        thresholdRejected++;', '                    else\n                        deliveryValueRejected++;')
              s = rep(s, '                if (best == null || demand.Value + demand.EconomyStrategicUrgency\n                    > best.Value + best.EconomyStrategicUrgency)', '                if (best == null || demand.Value > best.Value)')
              s = rep(s, '                ? $"considered={considered} kept={kept} best=none "\n                    + $"wait={intentState.BaseExpansionWaitTurns} urgency={urgency:0.##}"\n                : $"considered={considered} kept={kept} best={best.EconomyBuildCard.Definition.displayName} "\n                    + $"target=({best.TargetHex?.Q},{best.TargetHex?.R}) value={best.Value:0.##} "\n                    + $"wait={intentState.BaseExpansionWaitTurns} urgency={urgency:0.##}";', '                ? $"considered={considered} kept={kept} best=none"\n                : $"considered={considered} kept={kept} best={best.EconomyBuildCard.Definition.displayName} "\n                    + $"target=({best.TargetHex?.Q},{best.TargetHex?.R}) value={best.Value:0.##}";')
              s = rep(s, '            && rival.Value >= AiConfigV2.economyBaseDemandMinValue\n', '            && rival.Value > AiConfigV2.allocatorSliceEpsilon\n')
              return s
          edit('Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs', demand)

          def phase(s):
              s = rep(s, '.ThenByDescending(d => d.Value + d.EconomyStrategicUrgency)', '.ThenByDescending(d => d.Value)')
              s = rep(s, '(s.Demand.Value + s.Demand.EconomyStrategicUrgency)\n                    * RadarValueScale.For(radar, s.Demand.RequestingAxis)', 's.Demand.Value * RadarValueScale.For(radar, s.Demand.RequestingAxis)')
              return rep(s, '                EconomyStrategicUrgency = d.EconomyStrategicUrgency,\n', '')
          edit('Scripts/Ai/V2/Strategy/StrategicPhaseA.cs', phase)

          def planner(s):
              return rep(s, '                    // Wait urgency belongs only to lane-local admission, not intrinsic TaskScore.\n                    LocalAdmissionScore = d.Value + d.EconomyStrategicUrgency,', '                    // Newly admitted Economy missions use their canonical net TaskScore.\n                    LocalAdmissionScore = d.Value,')
          edit('Scripts/Ai/V2/Missions/EconomyMissionPlanner.cs', planner)
          edit('Scripts/Ai/V2/Strategy/Demand/AxisDemand.cs', lambda s: rep(s, '        public float EconomyStrategicUrgency;\n', ''))

          def state(s):
              s = rep(s, '        private int _baseExpansionEligibleTurn = -1;\n        private int _baseExpansionLastReconciledTurn = -1;\n        private CardData _baseExpansionCard;\n        private HexCoord? _baseExpansionTarget;\n', '')
              s = rep(s, '        internal bool IsStagedBaseExpansion(CardData card, HexCoord? target) =>\n            card == _baseExpansionCard && target.HasValue\n            && target.Equals(_baseExpansionTarget);\n\n        public int BaseExpansionWaitTurns { get; private set; }\n\n', '')
              s = rep(s, '        // project so Demand can compare other sites instead of manufacturing urgency forever.\n', '        // project so Demand can compare other sites instead of repeating a failed delivery.\n')
              s = rep(s, '            ResetBaseExpansionWait();\n', '')
              s = cut(s, '        // Pre-intent continuity for a legal Base opportunity. A Base mission cannot own a durable\n', '    }\n\n    public static class MissionIntentRegistry\n')
              return s
          edit('Scripts/Ai/V2/Continuity/MissionIntentState.cs', state)

          def continuity(s):
              s = rep(s, '            state.ReconcileBaseExpansionWait(turn, outcomes);\n', '')
              return rep(s, '        // Same fallback MissionIntentState\'s own Base-expansion outcome matching uses: a\n        // materialized outcome carries its EconomyTarget directly, but a fresh mission that failed\n', '        // A materialized outcome carries its EconomyTarget directly, but a fresh mission that failed\n')
          edit('Scripts/Ai/V2/Continuity/MissionContinuityLayer.cs', continuity)

          def config(s):
              s = rep(s, '        public const float economyBaseDemandMinValue = 12f;\n', '')
              return rep(s, '        // Pre-commitment staging and post-commitment switching are separate hysteresis decisions.\n        public const float economyBaseUrgencyPerDeferredTurn = 12f;\n        public const float economyBaseStagingHysteresisThreshold = 3f;\n', '        // Initial Base admission uses positive net TaskScore; commitment switching keeps hysteresis.\n')
          edit('Scripts/Ai/V2/Foundation/AiConfigV2.Economy.cs', config)

          def unified(s):
              s = rep(s, '                EconomyStrategicUrgency = 3f,\n', '')
              return rep(s, '            Assert.That(proposal.LocalAdmissionScore, Is.EqualTo(score.Value + 3f));', '            Assert.That(proposal.LocalAdmissionScore, Is.EqualTo(score.Value));')
          edit('Editor/AiUnifiedTaskScoreTests.cs', unified)

          def economy_tests(s):
              def no_wait(m):
                  m = rep(m, 'BaseExpansionUrgency_GrowsAfterDeferralButStaysLaneLocal', 'BaseExpansion_WaitDoesNotInflateTaskValueOrMissionAdmission')
                  m = rep(m, '                MissionIntentRegistry.GetOrCreate(player)\n                    .ReconcileBaseExpansionWait(1, System.Array.Empty<MissionTurnOutcome>());\n', '')
                  m = cut(m, '                Assert.That(first.EconomyStrategicUrgency, Is.Zero);\n', '            }\n            finally\n', '                Assert.That(second.Value, Is.EqualTo(first.Value).Within(0.0001f));\n                Assert.That(mission.BaseValue, Is.EqualTo(second.Value));\n                Assert.That(mission.LocalAdmissionScore, Is.EqualTo(mission.BaseValue));\n')
                  return m
              s = method(s, 'BaseExpansionUrgency_GrowsAfterDeferralButStaysLaneLocal', body_edit=no_wait)
              def positive(m):
                  m = rep(m, 'BaseExpansionUrgency_CanAdmitPositiveSiteInitiallyBelowDemandThreshold', 'BaseExpansion_PositiveNetSiteAdmittedWithoutWaiting')
                  return cut(m, '                Assert.That(DemandLayer.EconomyDemands(snapshot,\n', '            }\n            finally\n', '                AxisDemand first = DemandLayer.EconomyDemands(snapshot,\n                    new DesireBreakdown(), player, null, null).Single();\n                Assert.That(first.Value, Is.GreaterThan(AiConfigV2.allocatorSliceEpsilon));\n                Assert.That(first.Value, Is.LessThan(12f),\n                    "Positive sites previously below the fixed threshold must now be considered.");\n                snapshot.TurnNumber = 2;\n                AxisDemand second = DemandLayer.EconomyDemands(snapshot,\n                    new DesireBreakdown(), player, null, null).Single();\n                Assert.That(second.Value, Is.EqualTo(first.Value).Within(0.0001f));\n')
              s = method(s, 'BaseExpansionUrgency_CanAdmitPositiveSiteInitiallyBelowDemandThreshold', body_edit=positive)
              def negative(m):
                  m = rep(m, 'BaseExpansionUrgency_CanAdmitMeaningfulNegativeDeliveryValue', 'BaseExpansion_NegativeNetSiteNeverAdmittedByElapsedTurns')
                  return cut(m, '                AxisDemand admitted = null;\n', '            }\n            finally\n', '                for (int turn = 1; turn <= 8; turn++)\n                {\n                    snapshot.TurnNumber = turn;\n                    Assert.That(DemandLayer.EconomyDemands(snapshot,\n                        new DesireBreakdown(), player, null, null), Is.Empty,\n                        $"Negative-net Base must not become eligible on turn {turn}.");\n                }\n')
              s = method(s, 'BaseExpansionUrgency_CanAdmitMeaningfulNegativeDeliveryValue', body_edit=negative)
              s = method(s, 'BaseExpansionUrgency_ResetsWhenBaseBuildCompletes')
              s = method(s, 'BaseExpansionUrgency_ResetsOnPreProvisionStructuralInvalidation')
              return rep(s, '            Assert.That(state.BaseExpansionWaitTurns, Is.Zero);\n', '')
          edit('Editor/AiEconomyDecisionTests.cs', economy_tests)

          def radar_test(s):
              s = rep(s, '            // Intrinsic 12 > intrinsic 10 + urgency 1. The old admission implementation\n            // ranked them 4.2 and 4.5 when Economy radar was cold, reversing the lane.\n', '            // Intrinsic 12 > intrinsic 10. Radar must not reverse this within-lane ordering.\n')
              s = rep(s, 'intrinsic: 12f, urgency: 0f, radar: radar', 'intrinsic: 12f, radar: radar', 2)
              s = rep(s, 'intrinsic: 10f, urgency: 1f, radar: radar', 'intrinsic: 10f, radar: radar')
              s = rep(s, 'float intrinsic, float urgency, Radar radar', 'float intrinsic, Radar radar')
              return rep(s, 'LocalAdmissionScore = intrinsic + urgency,', 'LocalAdmissionScore = intrinsic,')
          edit('Editor/AiRadarAdmissionRegressionTests.cs', radar_test)

          import re
          banned = re.compile(r'EconomyStrategicUrgency|BaseExpansionWaitTurns|MarkBaseExpansionCandidate|ReconcileBaseExpansionWait|economyBaseUrgencyPerDeferredTurn|economyBaseDemandMinValue|economyBaseStagingHysteresisThreshold|IsStagedBaseExpansion|ResetBaseExpansionWait')
          dangling = []
          for directory in (root/'Scripts', root/'Editor'):
              for f in directory.rglob('*.cs'):
                  if banned.search(f.read_text(encoding='utf-8')):
                      dangling.append(str(f))
          assert not dangling, f'dangling old urgency references: {dangling}'
          assert len(changed) == 10, changed
          print('Changed exactly these files:')
          print('\n'.join(changed))
          print('PASS: no remaining references to removed urgency and wait APIs')
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/Ai/V2 Assets/Editor
          git commit -m 'fix(ai-v2): remove base wait urgency from demand, admission and continuity'
          git push origin HEAD:fix/remove-base-wait-urgency
