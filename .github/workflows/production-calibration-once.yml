name: AI V2 production calibration patch
on:
  push:
    branches:
      - fix/ai-v2-production-calibration
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore(ai-v2): run guarded patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate surgical source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/production_calibration_patch.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/Ai/V2/Strategy/Demand/AxisDemand.cs Assets/Scripts/Ai/V2/Evaluation/Cards/StrategicCardEvaluator.cs Assets/Scripts/Ai/V2/Materialization/MaterializationCandidateBuilder.cs
          git commit -m 'fix(ai-v2): calibrate Production scoring and resource opportunity costs'
          git push origin HEAD:fix/ai-v2-production-calibration