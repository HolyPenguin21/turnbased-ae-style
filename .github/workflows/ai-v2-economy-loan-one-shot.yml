name: One-shot canonical economy loan correction
on:
  push:
    branches:
      - fix/economy-loan-canonical-delivery
    paths:
      - .github/workflows/ai-v2-economy-loan-one-shot.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs
            Assets/Editor/AiEconomyAssignmentApTests.cs
      - name: Patch the existing Economy owner and extend regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs')
          text = path.read_text()
          def replace_one(old, new, name):
              global text
              count = text.count(old)
              assert count == 1, f'{name}: expected one exact anchor, found {count}'
              text = text.replace(old, new, 1)
          replace_one('''            return EconomyBuilderCandidates(snap, target, routes, activeIntents, commitments)
                .Where(x => x.route.IsOnTarget || ActiveAssignment(activeIntents, x.army.ArmyId) == null
                    || ActiveAssignment(activeIntents, x.army.ArmyId).Kind == MissionKind.Economy
                    || EconomyLoanAllowed(ActiveAssignment(activeIntents, x.army.ArmyId), buildValue,
                        x.route.TravelCost, x.army.CurrentMovement, out _))
                .Select(x => AssessEconomyArmy(snap, target, x.route, x.army,
                    buildApCost, includeReturn))
                .Where(x => x.Suitability != EconomyArmySuitability.Ineligible)
''', '''            // Assess the EXACT candidate first. Loan admission must use the same projected
            // outbound/return activations and roster as the final Extraction/Base TaskScore.
            // A raw hex-distance fee here was a second, incompatible delivery scorer.
            return EconomyBuilderCandidates(snap, target, routes, activeIntents, commitments)
                .Select(x => AssessEconomyArmy(snap, target, x.route, x.army,
                    buildApCost, includeReturn))
                .Where(x => x.Suitability != EconomyArmySuitability.Ineligible)
                .Where(x => x.Route.IsOnTarget
                    || ActiveAssignment(activeIntents, x.Army.ArmyId) == null
                    || ActiveAssignment(activeIntents, x.Army.ArmyId).Kind == MissionKind.Economy
                    || EconomyLoanAllowed(ActiveAssignment(activeIntents, x.Army.ArmyId), buildValue,
                        x, buildApCost, out _))
''', 'assess-before-loan')
          replace_one('''                .ThenBy(x => x.TotalAssignmentApCost
                    + (!x.Route.IsOnTarget && x.Army?.HeroIsHomeVocation == true
''', '''                // Among equally suitable builders, rank the SAME complete economic loss
                // used by TaskScore, including the one-time interruption of a donor mission.
                // Otherwise a 1 AP cheaper loan can outrank a free builder despite costing
                // more intrinsic value after MoverOpportunityCost is applied.
                .ThenBy(x => Mathf.Max(0f, x.TotalAssignmentApCost - buildApCost)
                    * AiConfigV2.taskScoreReactivationApWeight
                    + EconomyMissionOpportunityCost(x, activeIntents))
                .ThenBy(x => x.TotalAssignmentApCost
                    + (!x.Route.IsOnTarget && x.Army?.HeroIsHomeVocation == true
''', 'builder-order')
          replace_one('''        internal static bool EconomyLoanAllowed(MissionIntent donor, float buildValue,
            int routeCost, int movementAvailable, out float netValue)
        {
            netValue = buildValue - AiConfigV2.economyLoanContinuationLoss
                - Mathf.Max(0, routeCost) * AiConfigV2.taskScoreReactivationApWeight;
            return EconomyDonorStructurallyEligible(donor)
                && routeCost <= movementAvailable
                && netValue >= AiConfigV2.economyLoanHysteresisThreshold;
        }
''', '''        internal static bool EconomyLoanAllowed(MissionIntent donor, float buildValue,
            EconomyBuilderChoice builder, float buildApCost, out float netValue)
        {
            // buildValue is the site's already-card-priced TaskScore.Value. Charge only
            // the extra REAL journey/return activation AP assessed for this actor, then
            // the ONE interruption loss also used by the final TaskScore. Do not levy
            // a second per-hex fee on top of the existing Delivery slot.
            float extraAp = Mathf.Max(0f,
                (builder?.TotalAssignmentApCost ?? buildApCost) - buildApCost);
            netValue = buildValue - extraAp * AiConfigV2.taskScoreReactivationApWeight
                - AiConfigV2.economyLoanContinuationLoss;
            // Same-turn reachability is a legality gate, not a score penalty. Preserve
            // the original donor/funding restrictions (Surveil and started Raid excluded).
            return builder != null && EconomyDonorStructurallyEligible(donor)
                && builder.Route.TravelCost <= builder.Route.CurrentMovement
                && netValue >= AiConfigV2.economyLoanHysteresisThreshold;
        }
''', 'loan-gate')
          path.write_text(text)
          testpath = Path('Assets/Editor/AiEconomyAssignmentApTests.cs')
          tests = testpath.read_text()
          anchor = '''    }
}
#endif
'''
          assert tests.count(anchor) == 1, 'unexpected Economy test class ending'
          added = '''        private static MissionIntent LoanableScout() => new MissionIntent
        {
            Kind = MissionKind.Scout,
            Status = IntentStatus.Active,
            Funding = CommitmentTier.Soft,
            Objective = new ScoutIntent { Kind = ScoutTargetKind.Explore },
        };

        [Test]
        public void EconomyLoan_AlreadyActivatedMoverPaysNoPerHexFee()
        {
            // Three hexes, three MP, activation already paid. Build card 2 AP;
            // site-only net 7 minus Scout interruption 4 = 3, above hysteresis 1.6.
            var route = Route(3, 3, 3, true, activationApCost: 4);
            var choice = new DemandLayer.EconomyBuilderChoice
            {
                Route = route,
                TotalAssignmentApCost = DemandLayer.EstimateEconomyAssignmentAp(route, 2f, false),
            };
            Assert.That(choice.TotalAssignmentApCost, Is.EqualTo(2f));
            bool allowed = DemandLayer.EconomyLoanAllowed(LoanableScout(), 7f, choice, 2f,
                out float netValue);
            Assert.That(netValue, Is.EqualTo(3f));
            Assert.That(allowed, Is.True, "already-paid movement must not be billed a second time by hex");
        }

        [Test]
        public void EconomyLoan_PricesActualOutboundAndReturnActivations()
        {
            // Fresh 4-AP activation moves three hexes; a return requires another 4 AP.
            // Same site and actor: with return 12 - 8 - 4 = 0 (reject);
            // without return 12 - 4 - 4 = 4 (allow).
            var route = Route(3, 3, 3, false, activationApCost: 4, returnTravelCost: 3);
            var choice = new DemandLayer.EconomyBuilderChoice { Route = route };
            choice.TotalAssignmentApCost = DemandLayer.EstimateEconomyAssignmentAp(route, 2f, true);
            Assert.That(choice.TotalAssignmentApCost, Is.EqualTo(10f));
            Assert.That(DemandLayer.EconomyLoanAllowed(LoanableScout(), 12f, choice, 2f,
                out float roundTrip), Is.False);
            Assert.That(roundTrip, Is.EqualTo(0f));
            choice.TotalAssignmentApCost = DemandLayer.EstimateEconomyAssignmentAp(route, 2f, false);
            Assert.That(DemandLayer.EconomyLoanAllowed(LoanableScout(), 12f, choice, 2f,
                out float oneWay), Is.True);
            Assert.That(oneWay, Is.EqualTo(4f));
        }

        [Test]
        public void EconomyLoan_ReachabilityAndDonorProtectionRemainHardGates()
        {
            var route = Route(4, 3, 3, true, activationApCost: 4);
            var choice = new DemandLayer.EconomyBuilderChoice
            {
                Route = route,
                TotalAssignmentApCost = DemandLayer.EstimateEconomyAssignmentAp(route, 2f, false),
            };
            Assert.That(DemandLayer.EconomyLoanAllowed(LoanableScout(), 30f, choice, 2f,
                out _), Is.False, "high value cannot make an unreachable loan legal");
            route = Route(3, 3, 3, true, activationApCost: 4);
            choice.Route = route;
            choice.TotalAssignmentApCost = DemandLayer.EstimateEconomyAssignmentAp(route, 2f, false);
            var surveillance = LoanableScout();
            surveillance.Objective = new ScoutIntent { Kind = ScoutTargetKind.Surveil };
            Assert.That(DemandLayer.EconomyLoanAllowed(surveillance, 30f, choice, 2f,
                out _), Is.False);
            var hardScout = LoanableScout();
            hardScout.Funding = CommitmentTier.Hard;
            Assert.That(DemandLayer.EconomyLoanAllowed(hardScout, 30f, choice, 2f,
                out _), Is.False);
            var startedRaid = new MissionIntent
            {
                Kind = MissionKind.Raid, Funding = CommitmentTier.Soft,
                Objective = new RaidIntent { OperationStarted = true },
            };
            Assert.That(DemandLayer.EconomyLoanAllowed(startedRaid, 30f, choice, 2f,
                out _), Is.False);
        }

'''
          tests = tests.replace(anchor, added + anchor, 1)
          testpath.write_text(tests)
          source = path.read_text()
          assert source.count('EconomyLoanAllowed(') == 2
          assert 'routeCost) * AiConfigV2.taskScoreReactivationApWeight' not in source
          assert source.count('EconomyMissionOpportunityCost(x, activeIntents)') == 1
          print('PASS: single-owner Economy policy patched; 3 NUnit regression cases added')
          PY
          git grep -n 'EconomyLoanAllowed(' HEAD -- Assets/Scripts/Ai/V2 Assets/Editor || true
          git diff --check
          git diff --stat
          git add -- Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs Assets/Editor/AiEconomyAssignmentApTests.cs
          git config user.name 'AI V2 patch delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai-v2): price Economy actor loans from canonical delivery cost'
          git push origin HEAD:fix/economy-loan-canonical-delivery