name: Scoped AI V2 closure patch
on:
  push:
    branches:
      - ai-v2/production-development-calibration
    paths:
      - .github/workflows/ai-v2-closure-one-shot.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact sources and apply the seven-file closure patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'ai-v2/production-development-calibration'
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          expected_sources = {
            'Assets/Scripts/Ai/V2/Strategy/PhaseB/TempoCandidateProvider.cs': 'f5b0cd0ed6af41457b1c842d941abe30c3cdd674',
            'Assets/Scripts/Ai/V2/Evaluation/Cards/NonCombatCardPlayer.cs': 'fafde77a5f9026b98858c4b84ec36849ce970e04',
            'Assets/Scripts/Ai/V2/Strategy/StrategicPhaseA.cs': 'bdba4ab87fda8589237dfe6b0adb274a25a31ac0',
            'Assets/Scripts/Ai/V2/Strategy/Demand/InfrastructureFulfillment.cs': '36e55dab818dd7fb578d3fbcc42027189d65bf44',
            'Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs': 'aed7de6d1a016d1d021556b5955e97ce64926df1',
            'Assets/Scripts/Ai/V2/Strategy/StrategicMaintenancePolicy.cs': 'aaf3548e168171c4d10b9e75cba3861aabe1a57a',
            'Assets/Editor/AiIndependentDevelopmentTests.cs': '5129539e96e59a09d880dda051543ace759a8cd8',
          }
          for path, sha in expected_sources.items():
            got = subprocess.check_output(['git','hash-object',path], text=True).strip()
            if got != sha:
              raise SystemExit(f'Source changed: {path} expected {sha}, got {got}')
          digests = [
            '7a97ad94b546476ba556b590b7049b8aaa3ce414747a2771e6118146cddadca9',
            'a5825f70fa1ab95236ae060aee48fe568a1d36c91af5bcbeac7698955c66396c',
            'e07dd1978ac1999777c6bc16f21905d6c7d67ab5da9bc9c1dfe0d997fc651a15',
            '587958292174a535afb4ddc18f8bccf5224b595f2aa69d4fc14c218e904b8848',
            '6bb4fd5912b0a3966b64a00b301d38e436bf3f9c604026c2c8f790a9b6290540',
            '6a6d46a2210fa491b7707e5deec66ea105e568e8ef93d3374ea7b5d6cb9c937e',
            'ec0f711cd2c9bc8fa56f185144b322528cc7abb316b312dab23a87e6f9762657',
          ]
          parts = [Path(f'.github/ai-v2-closure-part-{i}.txt').read_text().strip() for i in range(7)]
          if [len(x) for x in parts] != [1800]*6+[316]:
            raise SystemExit('Transport length mismatch')
          for i, (part, sha) in enumerate(zip(parts, digests)):
            if hashlib.sha256(part.encode()).hexdigest() != sha:
              raise SystemExit(f'Transport part {i} SHA mismatch')
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          sha = hashlib.sha256(patch).hexdigest()
          if sha != '56e7be07450960db4943208d0dc1888cf03d605b0d027e70c8a0c0f81c8d3169':
            raise SystemExit(f'Patch SHA-256 mismatch: {sha}')
          Path('/tmp/ai-v2-closure.patch').write_bytes(patch)
          print(f'Exact source/transport/patch hashes verified: {sha}, {len(patch)} bytes')
          PY
          git apply --check /tmp/ai-v2-closure.patch
          git apply /tmp/ai-v2-closure.patch
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
            'Assets/Scripts/Ai/V2/Strategy/PhaseB/TempoCandidateProvider.cs',
            'Assets/Scripts/Ai/V2/Evaluation/Cards/NonCombatCardPlayer.cs',
            'Assets/Scripts/Ai/V2/Strategy/StrategicPhaseA.cs',
            'Assets/Scripts/Ai/V2/Strategy/Demand/InfrastructureFulfillment.cs',
            'Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs',
            'Assets/Scripts/Ai/V2/Strategy/StrategicMaintenancePolicy.cs',
            'Assets/Editor/AiIndependentDevelopmentTests.cs',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if actual != expected:
            raise SystemExit(f'Unexpected changed source files: {actual ^ expected}')
          assert 'if (plan.Generation != null && residual == null)' not in Path('Assets/Scripts/Ai/V2/Strategy/PhaseB/TempoCandidateProvider.cs').read_text()
          print('Seven expected source/test files only; redundant Phase B veto removed')
          PY
          git config user.name 'ai-v2-scoped-patch'
          git config user.email 'ai-v2-scoped-patch@users.noreply.github.com'
          git add -- Assets/Scripts/Ai/V2/Strategy/PhaseB/TempoCandidateProvider.cs Assets/Scripts/Ai/V2/Evaluation/Cards/NonCombatCardPlayer.cs Assets/Scripts/Ai/V2/Strategy/StrategicPhaseA.cs Assets/Scripts/Ai/V2/Strategy/Demand/InfrastructureFulfillment.cs Assets/Scripts/Ai/V2/Strategy/Objectives/DevelopmentOpportunityEvaluator.cs Assets/Scripts/Ai/V2/Strategy/StrategicMaintenancePolicy.cs Assets/Editor/AiIndependentDevelopmentTests.cs
          git rm -f -- .github/ai-v2-closure-part-*.txt .github/workflows/ai-v2-closure-one-shot.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(ai-v2): close operator generation, aviation investment and surplus output gaps [skip ci]'
          git push origin HEAD:ai-v2/production-development-calibration