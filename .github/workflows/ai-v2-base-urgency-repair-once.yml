name: AI V2 base urgency patch repair once
on:
  push:
    branches:
      - fix/remove-base-wait-urgency
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run corrected guarded source patch without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p = Path('.github/workflows/ai-v2-base-urgency-audit-once.yml')
          s = p.read_text(encoding='utf-8')
          old = "              s = rep(s, '            ResetBaseExpansionWait();\\n', '')"
          new = "              s = rep(s, '            _baseExpansionDeliveryFailureCount = 0;\\n            ResetBaseExpansionWait();\\n', '            _baseExpansionDeliveryFailureCount = 0;\\n')"
          assert s.count(old) == 1, 'unexpected patch workflow version'
          s = s.replace(old, new)
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          assert s.count(start) == 1 and s.count(end) == 1
          code = s.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(code), 'guarded_ai_patch', 'exec'))
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scripts/Ai/V2 Assets/Editor
          git commit -m 'fix(ai-v2): remove base wait urgency and obsolete staging policy'
          git push origin HEAD:fix/remove-base-wait-urgency
