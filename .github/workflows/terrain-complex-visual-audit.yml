name: Terrain complex visual audit

on:
  push:
    branches:
      - asset/terrain-complex-palette-normalization
    paths:
      - Tools/terrain-assets/audit_clusters.py
      - .github/workflows/terrain-complex-visual-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: asset/terrain-complex-palette-normalization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy pyyaml

      - name: Run independent PNG audit
        run: python Tools/terrain-assets/audit_clusters.py

      - name: Validate terrain config and assets
        run: python Tools/terrain-assets/validate.py

      - name: Check patch
        run: git diff --check

      - name: Commit audit diagnostics
        shell: bash
        run: |
          git config user.name "terrain-visual-audit-bot"
          git config user.email "terrain-visual-audit-bot@users.noreply.github.com"
          git add Docs/terrain-complexes/independent-visual-audit.md
          git add Docs/terrain-complexes/*-reference-terrain-sheet.png
          git add Docs/terrain-complexes/*-current-clusters-audit.png
          if git diff --cached --quiet; then
            echo "No visual audit changes."
            exit 0
          fi
          git commit -m "Add independent terrain cluster visual audit"
          git push origin HEAD:asset/terrain-complex-palette-normalization
