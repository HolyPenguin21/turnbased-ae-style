name: Terrain complex visual audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: asset/terrain-complex-palette-normalization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy pyyaml

      - name: Run independent PNG audit
        run: python Tools/terrain-assets/audit_clusters.py

      - name: Validate terrain config and assets
        run: python Tools/terrain-assets/validate.py

      - name: Check patch
        run: git diff --check
