name: Apply AI V2 post-89 guarded patch once
on:
  push:
    branches:
      - fix/ai-v2-post89-correctness
    paths:
      - .github/workflows/ai-v2-post89-once.yml
permissions:
  contents: write
jobs:
  apply-verified-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact anchors and apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/ai-v2-post89-apply-once.py
          python3 .github/ai-v2-post89-apply-once.py
          git rm -- .github/ai-v2-post89-apply-once.py .github/workflows/ai-v2-post89-once.yml
          git add -- Assets/Scripts/UI/BattleScreenUI.cs Assets/Scripts/UI/BattleScreenUI.Combat.cs Assets/Scripts/Map/HexSelectionController.cs Assets/Scripts/Ai/AiTurnController.cs Assets/Scripts/Ai/V2/Execution/TaskExecutor.cs Assets/Editor/AiActiveDefenceBattleProofTests.cs Assets/Editor/AiActiveDefenceBattleProofTests.cs.meta
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai-v2): prove target destruction from own battle participants'
          git push origin HEAD:fix/ai-v2-post89-correctness