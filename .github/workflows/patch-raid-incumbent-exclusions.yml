name: Align raid incumbent exclusions

on:
  push:
    branches:
      - fix/raid-durable-actor-ownership
    paths:
      - .github/workflows/patch-raid-incumbent-exclusions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raid-durable-actor-ownership
          fetch-depth: 0
      - name: Apply guarded patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs')
          text = p.read_text(encoding='utf-8')
          old = '''                    incumbents.Add(ToCandidate(snap, o, breakdown,\n                            intent.PreferredMoverArmyId, intent.Raid.OperationStarted)\n                        .AsIncumbent(intent.Funding, intent.PreferredMoverArmyId));\n'''
          new = '''                    incumbents.Add(ToCandidate(snap, o, breakdown,\n                            intent.PreferredMoverArmyId, intent.Raid.OperationStarted, durableClaimedActors)\n                        .AsIncumbent(intent.Funding, intent.PreferredMoverArmyId));\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one incumbent ToCandidate call, got {count}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          if text.count('{') != text.count('}'):
              raise SystemExit('brace imbalance')
      - name: Validate diff
        run: |
          git diff --check
          git diff -- Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs
      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Ai/V2/Missions/AggressionMissionPlanner.cs
          git commit -m "fix(ai): keep committed donors out of raid continuations"
          git rm .github/workflows/patch-raid-incumbent-exclusions.yml
          git commit -m "chore: remove temporary raid exclusion workflow"
          git push origin HEAD:fix/raid-durable-actor-ownership
