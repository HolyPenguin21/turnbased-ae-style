name: One-shot residual admission correction
on:
  push:
    branches:
      - fix/radar-phase-a-residual-admission
    paths:
      - .github/workflows/ai-v2-one-shot-radar-residual-probe.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs
      - name: Patch canonical orchestration owner, verify and commit only C sharp
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs')
          s = p.read_text()
          old = ('                    // An unobserved Phase-B mutation may expose positive work even\n'
                 '                    // when it emitted no operational trigger. Be conservative: do not\n'
                 '                    // start a zero-Radar residual admission on that ambiguous frame.\n'
                 '                    if (phaseBRound.StateChanged && !operationalDirty)\n'
                 '                        zeroRadarResidualWindow = false;')
          new = ('                    // Phase B can change the hand or world without publishing a typed\n'
                 '                    // operational trigger. Reuse the canonical bounded admission loop\n'
                 '                    // on the settled state before admitting any zero-Radar residual.\n'
                 '                    if (phaseBRound.StateChanged && !operationalDirty)\n'
                 '                    {\n'
                 '                        noProgressCycles = 0;\n'
                 '                        yield return RunTypedAdmissions();\n'
                 '                    }')
          assert s.count(old) == 1, f'expected exactly one Phase B residual anchor, found {s.count(old)}'
          s = s.replace(old, new, 1)
          assert s.count('if (phaseBRound.StateChanged && !operationalDirty)') == 1
          assert 'zeroRadarResidualWindow = false;\n                    if (!phaseBRound.StateChanged' not in s
          p.write_text(s)
          print('PASS: Phase B mutation now gets canonical operational re-admission before residual')
          PY
          git diff --check
          git diff --stat
          git add -- Assets/Scripts/Ai/V2/Orchestration/AiStrategyV2Pipeline.cs
          git config user.name 'AI V2 patch delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai-v2): re-admit operational work after unannounced tempo mutations'
          git push origin HEAD:fix/radar-phase-a-residual-admission