name: One-time Economy continuity correction
on:
  push:
    branches: [refactor/unified-task-score]
permissions:
  contents: write
jobs:
  correct-economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-task-score
          fetch-depth: 4
      - name: Verify reviewed history and recover original intact patch
        run: |
          test "$(git rev-parse HEAD^)" = "5c963eca20d5cb12d7b760e5c1abc0d8bcd2c741"
          git cat-file -e effb52406ba7609d62e4d0127e28506f0ca17598^{commit}
      - name: Apply strictly matched Economy edits
        run: |
          python3 - <<'PY'
          import subprocess, base64, zlib
          old_workflow = subprocess.check_output(['git', 'show', 'effb52406ba7609d62e4d0127e28506f0ca17598:.github/workflows/taskscore-economy-once.yml'], text=True)
          encoded = [line.split('PAYLOAD: ',1)[1].strip() for line in old_workflow.splitlines() if 'PAYLOAD: ' in line]
          assert len(encoded)==1
          script=zlib.decompress(base64.b64decode(encoded[0])).decode()
          lines=script.splitlines()
          positions=[i for i,line in enumerate(lines) if line.startswith("edit(tests, 'using System.Collections.Generic;")]
          assert len(positions)==1, positions
          old_header = '''#if UNITY_INCLUDE_TESTS
          using System;
          using System.Collections.Generic;
          using System.Collections.Generic;
          using Game.Ai.V2;
          using Game.Combat;
          using Game.HexGrid;
          using Game.Players;
          using NUnit.Framework;
          '''
          new_header = '''#if UNITY_INCLUDE_TESTS
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using Game.Ai.V2;
          using Game.Combat;
          using Game.Economy;
          using Game.HexGrid;
          using Game.Players;
          using NUnit.Framework;
          '''
          old_header='\n'.join(line.removeprefix('          ') for line in old_header.splitlines())+'\n'
          new_header='\n'.join(line.removeprefix('          ') for line in new_header.splitlines())+'\n'
          lines[positions[0]]='edit(tests, '+repr(old_header)+', '+repr(new_header)+')'
          exec('\n'.join(lines))
          PY
      - name: Check exact scope and commit code only
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected={'Assets/Scripts/Ai/V2/Continuity/MissionIntent.Models.cs','Assets/Scripts/Ai/V2/Continuity/MissionContinuityLayer.cs','Assets/Scripts/Ai/V2/Missions/EconomyMissionPlanner.cs','Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs','Assets/Editor/AiUnifiedTaskScoreTests.cs'}
          assert changed==expected,(changed,expected)
          print('Exact scoped modifications:',len(changed))
          PY
          rm .github/workflows/taskscore-economy-once.yml
          git add Assets/Scripts/Ai/V2/Continuity/MissionIntent.Models.cs Assets/Scripts/Ai/V2/Continuity/MissionContinuityLayer.cs Assets/Scripts/Ai/V2/Missions/EconomyMissionPlanner.cs Assets/Scripts/Ai/V2/Strategy/Demand/DemandLayer.Economy.cs Assets/Editor/AiUnifiedTaskScoreTests.cs .github/workflows/taskscore-economy-once.yml
          git diff --cached --check
          git config user.name 'TaskScore Refactor'
          git config user.email 'taskscore-refactor@users.noreply.github.com'
          git commit -m 'Pin Economy continuation costing and persist intrinsic TaskScore'
          git push origin HEAD:refactor/unified-task-score